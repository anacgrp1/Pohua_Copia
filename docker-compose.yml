# Cotizador RFQ — entorno de desarrollo local.
#
# Sólo PostgreSQL, para probar el esquema y las migraciones antes de que lleguen
# a Neon (make db-up / db-reset / db-psql / db-smoke). Hasta 2026-10 traía
# también un PostgREST opcional que la aplicación nunca usó; se quitó junto con
# el rol `web_anon` que creaba (ver sql/schema.sql).
#
# En producción no se usa nada de esto: la app se conecta a Neon vía psycopg2.

services:
  db:
    image: postgres:16
    container_name: cotizador_db
    environment:
      POSTGRES_DB: ${PG_DATABASE:-cotizador}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DATABASE:-cotizador}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
