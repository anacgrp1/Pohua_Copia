# Cotizador RFQ — entorno de desarrollo local.
#
# Antes este archivo sólo declaraba PostgREST, pero scripts/db_init.sh y el
# Makefile hacían `docker compose exec -T db ...`. Como no existía ningún
# servicio llamado `db`, `make db-up`, `make db-reset` y `make db-psql` fallaban
# siempre. Aquí está el servicio que faltaba.
#
# En producción no se usa nada de esto: la app se conecta a Neon vía psycopg2.

services:
  db:
    image: postgres:16
    container_name: cotizador_db
    environment:
      POSTGRES_DB: ${PG_DATABASE:-cotizador}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DATABASE:-cotizador}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # PostgREST es opcional: sólo para explorar la base desde el navegador.
  # La aplicación NO lo usa. Arráncalo con:  docker compose --profile tools up -d
  postgrest:
    image: postgrest/postgrest
    container_name: cotizador_postgrest
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: postgres://${PG_USER:-postgres}:${PG_PASSWORD:-postgres}@db:5432/${PG_DATABASE:-cotizador}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: web_anon

volumes:
  pgdata:
