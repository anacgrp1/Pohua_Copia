name: db-smoke

# Levanta PostgreSQL 16 como service container y ejecuta el test de humo del
# DDL en cada push / PR. Es lo que garantiza que sql/schema.sql cargue limpio
# contra un motor real (los tests normales usan mocks).

on:
  push:
  pull_request:

jobs:
  postgres-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cotizador
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cotizador"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install psycopg2-binary

      - name: Test de humo del DDL contra PostgreSQL
        env:
          PG_HOST: localhost
          PG_PORT: "5432"
          PG_DATABASE: cotizador
          PG_USER: postgres
          PG_PASSWORD: postgres
          IMAP_SERVER: dummy
          IMAP_USER: dummy
          IMAP_PASSWORD: dummy
        run: python -m unittest tests.integration.test_smoke_postgres -v
