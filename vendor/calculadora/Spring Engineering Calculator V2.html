/* ---- weight-per-part hand-off to the price calculator ---- */
var EMBEDDED = (window.parent && window.parent!==window);
function weightBar(R){
  var kg=R.partWeightKg||0, lb=kg*2.2046226, g=kg*1000;
  var wlDisp=f(toDisp(R.wireLenTot||0,'len',STATE.unit),STATE.unit==='in'?3:1)+' '+ul('len');
  var disp = STATE.unit==='in'
    ? f(lb,5)+' lb &middot; '+f(lb*16,3)+' oz'
    : f(g,3)+' g &middot; '+f(kg,5)+' kg';
  var btn = EMBEDDED
    ? '<button class="wq-btn" onclick="sendWeight('+kg+',this)">Use this weight in the quote &#8594;</button>'
    : '<div class="wq-note">Open this tool from the price calculator to send the weight into a quote.</div>';
  return '<div class="card"><div class="card-h">Weight per Part</div><div class="card-b">'+
    '<div class="wq-row"><div class="wq-left"><div class="wq-v">'+disp+'</div>'+
    '<div class="wq-note" style="margin-top:2px;">Developed wire length &asymp; '+wlDisp+'</div>'+
    '<div class="wq-note">Estimated finished-part weight &mdash; developed wire volume &times; material density. Verify against a sample before quoting.</div>'+
    '</div>'+btn+'</div></div></div>';
}
/* El ultimo peso enviado, para no repetirlo. El render se dispara con cada
   tecla y no tiene sentido mandar treinta veces el mismo numero. */
var PESO_ENVIADO=null;

/* Manda el peso en cuanto se calcula. No hace falta pulsar nada: el numero ya
   existe, y un dato que existe y no llega vale lo mismo que no tenerlo -- el
   peso multiplica el $/lb, asi que sin el el material sale $0.00.
   Un resorte a medio definir da 0 o NaN: eso NO viaja, porque borraria el peso
   bueno que hubiera puesto antes. */
function pesoAutomatico(R){
  if(!EMBEDDED) return;
  var kg=R?R.partWeightKg:NaN;
  if(!isFinite(kg)||kg<=0) return;
  if(PESO_ENVIADO!==null&&Math.abs(kg-PESO_ENVIADO)<1e-12) return;
  PESO_ENVIADO=kg;
  sendWeight(kg,null,true);
}

function sendWeight(kg,btn,automatico){
  var lb=kg*2.2046226;
  /* El peso viaja con el material que lo produjo. Si alguien cambio el
     desplegable, el cotizador tiene que enterarse: su $/lb sigue siendo el
     del codigo que mando el lector. */
  var _mid=(STATE.tab==='compression')?STATE.comp.matId:
           (STATE.tab==='extension')?STATE.ext.matId:STATE.tors.matId;
  var _mnm=(getMat(_mid)||{}).name||'';
  try{ window.parent.postMessage({source:'spring-calculator',type:'springWeight',
    weightLb:lb,springType:STATE.tab,matId:_mid, matName:_mnm,
    /* Quien lo mando: a mano manda sobre lo automatico, y el cotizador
       necesita saberlo para no pisar lo que escribio una persona. */
    automatico:!!automatico},'*'); }catch(e){}
  if(btn){ btn.textContent='Sent to quote \u2713'; btn.disabled=true;
    setTimeout(function(){ btn.disabled=false;
      btn.innerHTML='Use this weight in the quote &#8594;'; },2000); }
}

/* ---- drawing-derived feasibility checklist (from the price calculator) ---- */
var DRAWING=null, FEAS={};
/* Puesto en cuanto alguien toca el desplegable de material. El payload del
   lector se reenvia cada vez que se abre el panel, y sin esto reimpondria su
   codigo encima de la eleccion de la persona -- ya con el peso mandado al
   cotizador, que es cuando mas duele. Cambiar de plano recarga el iframe y
   la bandera vuelve a false sola. */
var MAT_MANUAL=false;
/* El veredicto del lector: las cinco condiciones sobre el dato. Aqui se le
   suma la sexta -- que haya maquina -- y se cierra. */
var VERDICT=null;
window.addEventListener('message',function(e){
  var d=e.data||{};
  if(d.source!=='price-calc'||d.type!=='drawingData') return;
  /* Un resorte distinto estrena pizarra. Sin esto, lo que el plano nuevo no
     mencione se queda del anterior -- y con MAT_MANUAL puesto, hasta el
     material, que es lo que ese flag protege a proposito cuando se trata del
     MISMO resorte. Reabrir el mismo no borra nada: para eso se compara. */
  var _quien=(d.pn||'')+'|'+(d.partName||'');
  if(ULTIMO_PLANO!==null && _quien!==ULTIMO_PLANO){
    var _L=JSON.parse(LIMPIO);
    STATE.meta=_L.meta; STATE.comp=_L.comp; STATE.ext=_L.ext; STATE.tors=_L.tors;
    MAT_MANUAL=false;
  }
  ULTIMO_PLANO=_quien;
  DRAWING=d; FEAS={}; VERDICT=d.verdict||null;
  if(d.springType&&(d.springType==='compression'||d.springType==='extension'||d.springType==='torsion'))
    STATE.tab=d.springType;
  try{ applyDrawingDims(d); }catch(_){}
  render();
});
function dField(d,key){
  if(!d||!d.fields) return null;
  for(var i=0;i<d.fields.length;i++) if(d.fields[i].key===key){
    var v=parseFloat(d.fields[i].value); if(!isFinite(v)) return null;
    return {v:v,unit:(d.fields[i].unit||'').toLowerCase()};
  }
  return null;
}
function dMM(d,key){ var f=dField(d,key); if(!f) return null;
  return (f.unit==='in'||f.unit==='inch')? f.v*25.4 : f.v; }
/* dField parsea a numero y descarta lo demas, asi que los campos de texto como
   el sentido de enrollado necesitan su propio accesor. */
function dRaw(d,key){
  if(!d||!d.fields) return null;
  for(var i=0;i<d.fields.length;i++) if(d.fields[i].key===key)
    return String(d.fields[i].value||'').trim().toLowerCase();
  return null;
}
function applyDrawingDims(d){
  var t=d.springType;
  /* Identidad de la pieza. Antes esta casilla se quedaba vacia y habia que
     teclear el numero de parte otra vez, aunque el lector ya lo hubiera sacado
     del cajetin. Solo se pisa si viene algo: no se borra lo que escribio nadie. */
  if(d.pn){ STATE.meta.partNo=String(d.pn); }
  if(d.partName){ STATE.meta.partName=String(d.partName); }
  var wd=dMM(d,'wireDia'),od=dMM(d,'od'),id=dMM(d,'id'),md=dMM(d,'meanDia'),
      fl=dMM(d,'freeLength'),bl=dMM(d,'bodyLength'),nt=dField(d,'coils');
  if(t==='compression'){ var I=STATE.comp;
    if(wd)I.d=wd;
    if(od){I.odMode='OD';I.dia=od;}else if(id){I.odMode='ID';I.dia=id;}else if(md){I.odMode='mean';I.dia=md;}
    if(fl)I.L0=fl;
    /* El tipo de extremo lo dice el plano ("CLOSED AND GROUND", "SQUARED AND
       GROUND"...). Hasta ahora se elegia a mano y se quedaba en el valor por
       defecto: sobre los planos ISC ese defecto acertaba, pero en silencio.
       Va ANTES de derivar Na, porque endCoils sale de aqui. */
    var _et=dRaw(d,'endType');
    if(_et&&END_TYPES[_et]) I.endType=_et;
    if(nt){I.Nt=nt.v;I.Na=I.Nt-END_TYPES[I.endType].endCoils;}
    /* La altura de trabajo manda la deflexion, y con ella carga, tension y
       factor de seguridad. Vacia, salian todos cero. */
    var wh=dMM(d,'workingHeight'); if(wh)I.h=wh;
  }else if(t==='extension'){ var E=STATE.ext;
    if(wd)E.d=wd;
    if(od){E.odMode='OD';E.dia=od;}else if(id){E.odMode='ID';E.dia=id;}else if(md){E.odMode='mean';E.dia=md;}
    if(bl)E.bodyLen=bl; if(nt)E.Na=nt.v;
    var fi=dField(d,'initialTension'); if(fi&&fi.v)E.Fi=fi.v;
  }else if(t==='torsion'){ var T=STATE.tors;
    if(wd)T.d=wd;
    if(md){T.odMode='mean';T.dia=md;}else if(od){T.odMode='OD';T.dia=od;}else if(id){T.odMode='ID';T.dia=id;}
    if(nt)T.Nb=nt.v;
    /* Brazos y angulo tambien vienen del plano. Sin angulo no hay par, ni
       tension, ni factor de seguridad: salian cero, que se lee como "sin
       riesgo" cuando en realidad significa "sin datos". */
    var lg=dMM(d,'legLength'); if(lg)T.legLen=lg;
    var an=dField(d,'angle');  if(an&&an.v)T.angle=an.v;
    var wdir=dRaw(d,'windDir');
    if(wdir==='right'||wdir==='left')T.windDir=wdir;
  }
  /* El lector manda DOS cosas en el campo de material: `value` es el texto tal
     cual del plano ("EN 10270-1 SH/DH", "ASTM A313 302", "SWP-B") y `code` es el
     codigo ISC ya resuelto ("MW", "SS"). La tabla _mm de abajo esta hecha para
     recibir el CODIGO, pero se leia el TEXTO -- y como la busqueda es por
     coincidencia exacta, ninguna designacion real casaba: sobre 7 textos de
     planos reales el material se quedaba siempre en el de por defecto, y con el
     la densidad, la resistencia y el factor de seguridad. */
  /* El acabado no entra en el calculo del resorte, pero si en la ruta de
     coste, y sale del plano igual que lo demas. */
  var _fin=dRaw(d,'finish');
  if(_fin) STATE.meta.finish=_fin;

  var _mc='';
  for(var _k=0;_k<(d.fields||[]).length;_k++){
    if(d.fields[_k].key==='material'){ var _f=d.fields[_k];
      _mc=String(_f.code||_f.value||'').toUpperCase().replace(/[^A-Z0-9]/g,''); break; }
  }
  /* Los alias salen del catalogo del nucleo: anadir una forma de
     escribir un material se hace en un sitio, no en dos ficheros. */
  var _mid=materialDelTexto(_mc);
  if(_mid && !MAT_MANUAL){ STATE.comp.matId=_mid; STATE.ext.matId=_mid;
                           STATE.tors.matId=_mid; }
}
function feasCard(){
  if(!DRAWING||!DRAWING.feasibility||!DRAWING.feasibility.length) return '';
  var h='<div class="card feas-card"><div class="card-h">Drawing Feasibility Checklist</div>'+
    '<div class="card-b"><div class="legend">Items read from the customer drawing. '+
    'Click a row to see the exact drawing region, then mark it OK or Not OK.</div>';
  for(var i=0;i<DRAWING.feasibility.length;i++){
    var it=DRAWING.feasibility[i], st=FEAS[it.id]||'';
    h+='<div class="fitem '+(st==='ok'?'s-ok':st==='no'?'s-no':'')+'" onclick="viewCrop('+i+')">'+
      '<div class="fl">'+esc(it.label)+'</div>'+
      '<div class="fbtns" onclick="event.stopPropagation()">'+
      '<button class="fbtn ok '+(st==='ok'?'on':'')+'" onclick="setFeas(&quot;'+it.id+'&quot;,&quot;ok&quot;)">OK</button>'+
      '<button class="fbtn no '+(st==='no'?'on':'')+'" onclick="setFeas(&quot;'+it.id+'&quot;,&quot;no&quot;)">Not OK</button>'+
      '</div></div>';
  }
  h+='</div></div>';
  return h;
}
function setFeas(id,st){ FEAS[id]=(FEAS[id]===st?'':st); render(); }
function viewCrop(i){
  var it=DRAWING&&DRAWING.feasibility?DRAWING.feasibility[i]:null; if(!it) return;
  document.getElementById('cropTitle').textContent='Drawing region';
  document.getElementById('cropImg').src=it.crop||'';
  document.getElementById('cropMeta').innerHTML='<b>'+esc(it.label)+'</b>';
  document.getElementById('cropOv').classList.add('on');
}
function closeCrop(){ document.getElementById('cropOv').classList.remove('on'); }

/* ---- header / tab binding (once) ---- */
document.getElementById('unitToggle').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  STATE.unit=b.dataset.u; render();
});
document.getElementById('tabs').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  STATE.tab=b.dataset.t; render();
});

/* ---- initial paint ---- */
render();
</script>

  <div class="crop-box">

  </div>
