<!DOCTYPE html>
<html data-nube-tema="1" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spring Engineering Calculator</title>
<style>
:root{
  --bg:transparent; --panel:#ffffff; --panel-alt:#f8fafc;
  --line:#e2e8f0; --line-strong:#cbd5e1;
  --ink:#0f172a; --ink-soft:#475569;
  --accent:#1b3d79; --accent-soft:#e8eef8;
  --ok:#1f8a4c; --ok-bg:#e9f6ee;
  --warn:#b9770e; --warn-bg:#fdf3e0;
  --crit:#c0392b; --crit-bg:#fdeceb;
  --info:#1f5fa8; --info-bg:#eaf1f9;
  --shadow:0 1px 2px rgba(20,40,70,.06),0 2px 8px rgba(20,40,70,.05);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:transparent !important;color:var(--ink);
  font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;}
.wrap{max-width:1340px;margin:0 auto;padding:0 18px 60px;}

/* ---- header ---- */
header{border-bottom:1px solid var(--line);background:var(--n-papel);position:sticky;top:0;z-index:20;}
.hbar{max-width:1340px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;
  justify-content:space-between;gap:16px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:11px;}
.logo{width:38px;height:38px;border-radius:7px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;flex:none;}
.brand h1{font-size:17px;font-weight:700;letter-spacing:-.2px;}
.brand p{font-size:11.5px;color:var(--ink-soft);font-weight:500;}
.hright{display:flex;align-items:center;gap:14px;}
.unit-toggle{display:flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden;}
.unit-toggle button{border:none;background:var(--n-papel);padding:7px 14px;font-size:12.5px;font-weight:600;
  cursor:pointer;color:var(--ink-soft);}
.unit-toggle button.on{background:var(--accent);color:#fff;}
.ulbl{font-size:11px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.5px;}

/* ---- tabs ---- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);background:var(--n-papel);
  max-width:1340px;margin:0 auto;padding:0 18px;}
.tabs button{border:none;background:none;padding:13px 18px;font-size:13.5px;font-weight:600;
  cursor:pointer;color:var(--ink-soft);border-bottom:3px solid transparent;margin-bottom:-1px;}
.tabs button:hover{color:var(--ink);}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);}

/* ---- layout ---- */
.layout{display:grid;grid-template-columns:370px 1fr;gap:20px;margin-top:20px;align-items:start;}
@media(max-width:980px){.layout{grid-template-columns:1fr;}}

/* ---- cards ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow);margin-bottom:16px;}
.card-h{padding:11px 15px;border-bottom:1px solid var(--line);font-weight:700;font-size:12.5px;
  text-transform:uppercase;letter-spacing:.6px;color:var(--n-marca-tinta);display:flex;
  align-items:center;justify-content:space-between;}
.card-b{padding:14px 15px;}

/* ---- inputs ---- */
.grp-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  color:var(--ink-soft);margin:14px 0 8px;padding-bottom:5px;border-bottom:1px dashed var(--line);}
.grp-title:first-child{margin-top:0;}
.field{margin-bottom:9px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:3px;}
.field .u{color:var(--accent);font-weight:700;}
.field input,.field select{width:100%;padding:7px 9px;border:1px solid var(--line-strong);
  border-radius:6px;font-size:13px;font-family:inherit;color:var(--ink);background:var(--n-papel);}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft);}
.field input.derived{background:var(--n-papel);color:var(--n-marca-tinta);font-weight:600;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.hint{font-size:10.5px;color:var(--ink-soft);margin-top:2px;}

/* ---- results summary ---- */
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border-radius:8px;overflow:hidden;border:1px solid var(--line);}
@media(max-width:560px){.sum-grid{grid-template-columns:repeat(2,1fr);}}
.sum-cell{background:var(--n-papel);padding:11px 12px;}
.sum-cell .k{font-size:10.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;
  letter-spacing:.4px;}
.sum-cell .v{font-size:18px;font-weight:700;color:var(--ink);margin-top:2px;}
.sum-cell .v small{font-size:11px;color:var(--ink-soft);font-weight:600;}

/* ---- detail table ---- */
table.det{width:100%;border-collapse:collapse;}
table.det td{padding:7px 12px;border-bottom:1px solid var(--line);font-size:12.5px;}
table.det tr:last-child td{border-bottom:none;}
table.det td.lbl{color:var(--ink-soft);font-weight:600;}
table.det td.val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;}
table.det td.val small{color:var(--ink-soft);font-weight:600;font-size:10.5px;}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:10.5px;font-weight:700;}
.pill.ok{background:var(--ok-bg);color:var(--ok);}
.pill.warn{background:var(--n-avi-fondo);color:var(--n-avi-tinta);}
.pill.crit{background:var(--crit-bg);color:var(--crit);}

/* ---- score card ---- */
.score-card{display:flex;gap:16px;align-items:center;}
.score-dial{flex:none;}
.score-meta{flex:1;}
.score-band{font-size:15px;font-weight:800;margin-bottom:3px;}
.score-desc{font-size:12px;color:var(--ink-soft);}
.score-bar{height:8px;border-radius:5px;background:var(--line);margin-top:9px;overflow:hidden;}
.score-bar i{display:block;height:100%;border-radius:5px;}

/* ---- flags ---- */
.flag{display:flex;gap:10px;padding:10px 12px;border-radius:8px;margin-bottom:8px;
  border:1px solid var(--line);}
.flag:last-child{margin-bottom:0;}
.flag.crit{background:var(--crit-bg);border-color:var(--n-mal-linea);}
.flag.warn{background:var(--n-avi-fondo);border-color:var(--n-avi-linea);}
.flag.info{background:var(--info-bg);border-color:var(--n-info-linea);}
.flag.ok{background:var(--ok-bg);border-color:var(--n-ok-linea);}
.flag .ic{flex:none;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:800;color:#fff;}
.flag.crit .ic{background:var(--crit);}
.flag.warn .ic{background:var(--n-avi-fondo);}
.flag.info .ic{background:var(--info);}
.flag.ok .ic{background:var(--ok);}
.flag .ft{font-size:12.5px;}
.flag .ft b{display:block;margin-bottom:1px;font-size:12.5px;}
.flag .ft .rec{color:var(--ink-soft);font-size:11.5px;margin-top:3px;}
.flag .ft .rec::before{content:"\21B3  Recommendation: ";font-weight:700;color:var(--accent);}

/* ---- machine card ---- */
.mch{border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-bottom:9px;}
.mch.best{border-color:var(--ok);background:var(--ok-bg);}
.mch.alt{border-color:var(--accent);background:var(--accent-soft);}
.mch.no{border-color:var(--crit);background:var(--crit-bg);}
.mch-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.mch-h b{font-size:13.5px;}
.mch-h .tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;
  padding:2px 8px;border-radius:20px;}
.mch.best .tag{background:var(--ok);color:#fff;}
.mch.alt .tag{background:var(--accent);color:#fff;}
.mch.no .tag{background:var(--crit);color:#fff;}
.mch-d{font-size:11.5px;color:var(--ink-soft);}
.mch-d span{display:inline-block;margin-right:12px;}

/* ---- diagram ---- */
.diagram{text-align:center;}
.diagram svg{max-width:100%;height:auto;}

/* ---- databases ---- */
.dbtable-wrap{overflow-x:auto;}
table.db{width:100%;border-collapse:collapse;font-size:12px;}
table.db th{background:var(--accent-soft);color:var(--n-marca-tinta);font-size:10.5px;
  text-transform:uppercase;letter-spacing:.4px;padding:8px 7px;text-align:left;
  border-bottom:2px solid var(--line-strong);white-space:nowrap;}
table.db td{padding:4px 6px;border-bottom:1px solid var(--line);}
table.db td.name{font-weight:700;white-space:nowrap;}
table.db input{width:74px;padding:4px 6px;border:1px solid var(--line-strong);border-radius:5px;
  font-size:11.5px;font-family:inherit;text-align:right;}
table.db input.wide{width:150px;text-align:left;}
table.db input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
table.db .chk{display:flex;gap:5px;}
table.db .chk label{font-size:10.5px;font-weight:600;display:flex;align-items:center;gap:2px;}
.btn{border:1px solid var(--line-strong);background:var(--n-papel);padding:7px 13px;border-radius:7px;
  font-size:12px;font-weight:600;cursor:pointer;color:var(--ink);}
.btn:hover{background:var(--n-papel);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.note-box{background:var(--n-avi-fondo);border:1px solid var(--n-avi-linea);border-radius:8px;padding:10px 12px;
  font-size:11.5px;color:var(--n-avi-tinta);margin-bottom:14px;}
.note-box b{color:var(--n-avi-tinta);}
.foot{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:26px;
  padding-top:16px;border-top:1px solid var(--line);}
.legend{font-size:11px;color:var(--ink-soft);margin-top:10px;line-height:1.7;}
.legend b{color:var(--ink);}
.subtab{display:flex;gap:6px;margin-bottom:14px;}
.subtab button{border:1px solid var(--line-strong);background:var(--n-papel);padding:6px 14px;border-radius:7px;
  font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-soft);}
.subtab button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.wq-row{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;}
.wq-left{flex:1;min-width:170px;}
.wq-v{font-size:20px;font-weight:800;color:var(--n-marca-tinta);}
.wq-note{font-size:11px;color:var(--ink-soft);margin-top:3px;line-height:1.5;}
.wq-btn{flex:none;background:var(--accent);color:#fff;border:none;border-radius:7px;padding:11px 17px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
.wq-btn:hover{background:var(--accent-deep);}
.wq-btn:disabled{background:var(--ok);cursor:default;}
.feas-card .legend{margin:0 0 10px;}
.fitem{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;cursor:pointer;}
.fitem:hover{background:var(--accent-soft);}
.fitem .fl{flex:1;font-size:12.5px;color:var(--ink);}
.fitem.s-ok{border-color:var(--ok);background:var(--ok-bg);}
.fitem.s-no{border-color:var(--crit);background:var(--crit-bg);}
.fbtns{display:flex;gap:4px;flex:none;}
.fbtn{border:1px solid var(--line-strong);background:var(--n-papel);border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;color:var(--ink-soft);font-family:inherit;}
.fbtn.ok.on{background:var(--ok);border-color:var(--ok);color:#fff;}
.fbtn.no.on{background:var(--crit);border-color:var(--crit);color:#fff;}
.crop-ov{display:none;position:fixed;inset:0;background:rgba(20,28,52,.6);z-index:5000;align-items:center;justify-content:center;padding:20px;}
.crop-ov.on{display:flex;}
.crop-box{background:var(--n-papel);border-radius:10px;max-width:680px;width:100%;overflow:hidden;box-shadow:0 12px 44px rgba(0,0,0,.32);}
.crop-h{padding:11px 15px;background:var(--accent);color:#fff;font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center;}
.crop-h button{background:none;border:0;color:#fff;font-size:21px;cursor:pointer;line-height:1;}
.crop-b{padding:15px;}
.crop-b img{max-width:100%;border:1px solid var(--line);border-radius:6px;display:block;background:var(--n-papel);}
.crop-meta{margin-top:11px;font-size:12.5px;color:var(--ink);}

/* ===================== DATASHEET REDESIGN ===================== */
html,body{height:100%;overflow:hidden;background:var(--n-sutil);font-size:12px;}
body{display:flex;flex-direction:column;}
header{position:static;top:auto;height:46px;flex:none;display:flex;align-items:center;
  justify-content:space-between;padding:0 13px;gap:12px;border-bottom:2px solid var(--accent);}
.ds-brand{display:flex;align-items:center;gap:9px;}
.ds-brand .logo{width:30px;height:30px;border-radius:6px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;flex:none;}
.ds-brand h1{font-size:14px;font-weight:800;letter-spacing:-.2px;line-height:1.05;}
.ds-brand p{font-size:9px;color:var(--ink-soft);font-weight:600;}
.ds-tabs{display:flex;gap:3px;}
.ds-tabs button{border:1px solid var(--line-strong);background:var(--n-papel);padding:6px 13px;
  font-size:11.5px;font-weight:700;cursor:pointer;color:var(--ink-soft);border-radius:5px;
  font-family:inherit;}
.ds-tabs button:hover{color:var(--ink);}
.ds-tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.ds-units{display:flex;align-items:center;gap:7px;}

#appwrap{flex:1;min-height:0;overflow:auto;padding:7px;}

/* ---- the datasheet ---- */
.sheet{height:calc(100vh - 60px);background:var(--n-papel);border:1px solid var(--line-strong);
  border-radius:5px;display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,0.96fr);
  grid-template-rows:auto minmax(0,1fr);overflow:hidden;
  box-shadow:0 2px 10px rgba(20,40,70,.10);}

/* part-info strip */
.ds-info{grid-column:1/-1;display:flex;flex-wrap:wrap;background:var(--n-papel);
  border-bottom:1px solid var(--line-strong);}
.fcell{flex:1 1 14%;min-width:118px;padding:4px 9px;border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);}
.fcell .k{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;
  color:var(--ink-soft);}
.fcell .v{font-size:12px;font-weight:800;color:var(--n-marca-tinta);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fcell input,.fcell select{width:100%;border:1px solid var(--line-strong);border-radius:4px;
  padding:2px 4px;font-size:11.5px;font-family:inherit;font-weight:700;color:var(--ink);
  background:var(--n-papel);margin-top:1px;}
.fcell input:focus,.fcell select:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 2px var(--accent-soft);}
.fcell .wbtn{margin-top:3px;width:100%;border:0;background:var(--accent);color:#fff;
  border-radius:4px;padding:3px;font-size:9.5px;font-weight:800;cursor:pointer;font-family:inherit;}
.fcell .wbtn:hover{background:var(--accent-deep);}
.fcell .wbtn:disabled{background:var(--ok);}

/* columns */
.ds-left{border-right:1px solid var(--line-strong);display:flex;flex-direction:column;
  min-height:0;overflow:hidden;}
.ds-right{display:flex;flex-direction:column;min-height:0;overflow:hidden;}
.ds-sech{background:var(--accent);color:#fff;font-size:9px;font-weight:800;
  text-transform:uppercase;letter-spacing:.8px;padding:4px 9px;flex:none;
  display:flex;justify-content:space-between;align-items:center;}

/* dimensions table */
.ds-tblwrap{flex:1;min-height:0;overflow:auto;}
table.dst{width:100%;border-collapse:collapse;}
table.dst th{position:sticky;top:0;background:var(--accent-soft);color:var(--n-marca-tinta);
  font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;padding:4px 7px;
  text-align:right;border-bottom:1px solid var(--line-strong);}
table.dst th:first-child{text-align:left;}
table.dst td{padding:0 7px;border-bottom:1px solid var(--line);font-size:11px;height:21px;
  text-align:right;font-variant-numeric:tabular-nums;}
table.dst td.p{text-align:left;color:var(--ink-soft);font-weight:600;white-space:nowrap;}
table.dst td.p b{color:var(--ink);font-weight:700;}
table.dst td.p span.sym{color:var(--accent);font-weight:700;font-size:9.5px;}
table.dst td.cv i{color:var(--ink-soft);font-style:normal;font-size:8.5px;font-weight:600;}
table.dst td.tol{text-align:center;color:var(--ink-soft);font-size:9px;}
table.dst tr.calc td{background:var(--n-papel);}
table.dst tr.calc td.cv{font-weight:800;color:var(--n-marca-tinta);}
table.dst tr.in td.cv{font-weight:700;}
table.dst tr.hd td{background:var(--n-papel);color:var(--n-marca-tinta);font-weight:800;font-size:8px;
  text-transform:uppercase;letter-spacing:.5px;text-align:left;height:18px;}
table.dst input{width:100%;border:1px solid var(--accent);border-radius:3px;padding:1px 4px;
  font-size:11px;font-family:inherit;font-weight:800;text-align:right;color:var(--n-marca-tinta);
  background:var(--n-avi-fondo);}
table.dst input:focus{outline:none;box-shadow:0 0 0 2px var(--accent-soft);}

/* right column */
.ds-rtop{flex:none;display:grid;grid-template-columns:1fr 1fr;
  border-bottom:1px solid var(--line-strong);height:206px;}
.ds-diag{border-right:1px solid var(--line);padding:3px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;overflow:hidden;}
.ds-diag svg{max-width:100%;max-height:198px;height:auto;}
.ds-graph{padding:3px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.ds-graph svg{max-width:100%;max-height:198px;height:auto;}
.ds-ph{color:var(--ink-soft);font-size:10.5px;text-align:center;padding:14px;}

.ds-checks{flex:none;border-bottom:1px solid var(--line-strong);padding:6px 9px;
  display:flex;gap:11px;align-items:center;}
.ds-score{flex:none;text-align:center;width:74px;}
.ds-score .band{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;
  margin-top:1px;line-height:1.15;}
.ds-kgrid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;}
.ds-kc{display:flex;justify-content:space-between;font-size:10.5px;border-bottom:1px dotted var(--line);
  padding-bottom:1px;}
.ds-kc .kk{color:var(--ink-soft);font-weight:600;}
.ds-kc .kv{font-weight:800;font-variant-numeric:tabular-nums;}
.ds-kc .kv.ok{color:var(--ok);}.ds-kc .kv.warn{color:var(--n-avi-tinta);}.ds-kc .kv.crit{color:var(--crit);}

.ds-panel{flex:1 1 0;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
.ds-panel+.ds-panel{border-top:1px solid var(--line-strong);}
.ds-panel-b{flex:1;min-height:0;overflow:auto;padding:6px 8px;}
.dsf{display:flex;gap:6px;font-size:10px;padding:4px 6px;border-radius:5px;margin-bottom:4px;
  border:1px solid var(--line);}
.dsf:last-child{margin-bottom:0;}
.dsf.crit{background:var(--crit-bg);border-color:var(--n-mal-linea);}
.dsf.warn{background:var(--n-avi-fondo);border-color:var(--n-avi-linea);}
.dsf.info{background:var(--info-bg);border-color:var(--n-info-linea);}
.dsf.ok{background:var(--ok-bg);border-color:var(--n-ok-linea);}
.dsf .di{flex:none;width:14px;height:14px;border-radius:50%;color:#fff;font-size:9px;
  font-weight:800;display:flex;align-items:center;justify-content:center;}
.dsf.crit .di{background:var(--crit);}.dsf.warn .di{background:var(--n-avi-fondo);}
.dsf.info .di{background:var(--info);}.dsf.ok .di{background:var(--ok);}
.dsf b{display:block;font-size:10px;}
.dsf .dr{color:var(--ink-soft);font-size:9.5px;margin-top:1px;}
.ds-feas-item{display:flex;align-items:center;gap:8px;padding:5px 7px;border:1px solid var(--line);
  border-radius:6px;margin-bottom:5px;cursor:pointer;}
.ds-feas-item:hover{background:var(--accent-soft);}
.ds-feas-item.s-ok{border-color:var(--ok);background:var(--ok-bg);}
.ds-feas-item.s-no{border-color:var(--crit);background:var(--crit-bg);}
.ds-feas-item .fl{flex:1;font-size:10.5px;}
.ds-feas-item .fbtns{display:flex;gap:3px;flex:none;}
.ds-feas-item .fbtn{border:1px solid var(--line-strong);background:var(--n-papel);border-radius:5px;
  padding:3px 8px;font-size:9.5px;font-weight:800;cursor:pointer;color:var(--ink-soft);
  font-family:inherit;}
.ds-feas-item .fbtn.ok.on{background:var(--ok);border-color:var(--ok);color:#fff;}

<script>
"use strict";
/* ============================================================================
   SPRING ENGINEERING CALCULATOR
   Self-contained, dependency-free. All internal calculation in SI base units:
   length = mm | force = N | stress = MPa (N/mm^2) | modulus = MPa | moment = N.mm
   Display layer converts to the user-selected unit system.
   ============================================================================ */

/* ===== REGLAS DEL TALLER: generado desde nucleo/motor/reglas.js — no editar aqui ===== */
/* Las reglas del taller de ISC.

   Qué máquina hace esta pieza, qué operaciones secundarias lleva, en qué caja
   va, a qué servicio de recubrimiento corresponde su acabado, y a qué cliente
   se parece un nombre escrito de otra forma.

   LA FRONTERA, QUE NO ES ARBITRARIA
     Aquí vive lo que las reglas DICEN. No vive si se escribe o no: eso depende
     de si una persona ya puso ese valor a mano, que es estado de una
     cotización abierta y no una regla del taller. Por eso `sugerirRuta`
     devuelve la ruta y es la aplicación quien decide si la aplica.

   NADA DE ESTO LEE UNA BASE DE DATOS NI UNA PANTALLA
     Las tablas entran por argumento -- `maquinas`, `embalajes`,
     `subcontratistas`, `clientes` --. Lo hace así para que el Cotizador pueda
     llamarlas con las filas que saca de Postgres y la calculadora con las que
     tiene en el navegador, sin que ninguno de los dos tenga su propia copia de
     la regla.

   Fuente única: este fichero. El HTML lo lleva incrustado (`construir.py`).
*/

/* ------------------------------------------------------------------ tipos */

/* Antes había una tabla de CARRILES por diámetro que elegía bobinadora sin
   mirar el tipo de resorte: mandaba compresión de 0,16" a la NUCOIL HX-60 --
   que no hace compresión -- y llegaba a 0,590" con la AIM 3000, que para en
   0,375". Ahora se filtra por tipo y por alambre, y gana la preferida. */
const SG_TIPO = { 'Compression Spring': 'compression', 'Tension Spring': 'extension',
                  'Torsion Spring': 'torsion', 'Wire Form': 'wireform' };
const SG_CAP = { compression: 'capC', extension: 'capE', torsion: 'capT', wireform: 'capW' };

/* El orden de preferencia lo dio Miguel Rodea (2026-09-03): entre las máquinas
   capaces, gana la que él pondría primero. */
const SG_ORDEN = {
  compression: ["SIMPLEX MC 50", "TORIN W11A", "AIM 3000", "TORIN W10A", "ZX250",
    "TORIN W125", "TORIN W115A", "TORIN FZ-11", "SHINKO TF-45", "TORIN W11T",
    "TORIN W12T", "KMH-508", "SHINKO TF-23", "KMH-516"],
  extension: ["TORIN W11A", "AIM 3000", "TORIN W125", "TORIN W115A", "TORIN FZ-11",
    "SHINKO TF-45", "NUCOIL HX-60", "NUCOIL CSF-200", "NUCOIL CSF-400", "SHINKO TF-23"],
  torsion: ["AIM 3000", "ZX250", "TORIN W125", "TORIN FZ-11", "SHINKO TF-45",
    "NUCOIL HX-60", "TORIN W11T", "NUCOIL CSF-200", "NUCOIL CSF-400", "TORIN W12T",
    "SHINKO TF-23"],
  wireform: ["AIM 3000", "ZX250", "NUCOIL HX-60", "NUCOIL CSF-200", "NUCOIL CSF-400",
    "AIM AFM-3D2-T"]
};

const _num = s => (typeof s === 'number' ? s
  : (!s ? null : (isNaN(parseFloat(String(s).replace(/[$,\s]/g, ''))) ? null
                  : parseFloat(String(s).replace(/[$,\s]/g, '')))));
const _norm = t => String(t).toUpperCase().replace(/\(FENN\)/, '').replace(/[^A-Z0-9]/g, '');

/* --------------------------------------------------------------- máquinas */

/* El tope por material: hay materiales que una máquina sólo dobla hasta un
   diámetro menor que el suyo. Devuelve por qué NO puede, o null.

   Rodea lo contestó en su columna «Material caps (if max dia drops)», y sólo
   para una: la SIMPLEX MC 50 con temple en aceite, que le baja de .198" a
   .165". Vive aquí, y no dentro de quien elige, porque lo aplican los dos
   lados -- el dictamen del Spring Calculator y la ruta automática de la
   cotización -- y es la misma regla: tiene que ser el mismo código.

   `material` es la fila del catálogo, no un identificador: se compara
   `capMaterial` con su nombre, así que un tope nuevo se añade como dato y esto
   no se toca. */
function topeDeMaterial(maquina, material, dmm) {
  if (!maquina || !material || !maquina.capWireMaxMm) return null;
  const suyo = String(maquina.capMaterial || '').trim().toLowerCase();
  if (!suyo || suyo !== String(material.name || '').trim().toLowerCase()) return null;
  if (!(dmm > maquina.capWireMaxMm)) return null;
  return suyo + ' above ' + maquina.capWireMaxMm + ' mm on this machine';
}

/* La bobinadora: entre las capaces para ese tipo y ese alambre, la que el
   taller prefiere. Sin tipo no se elige nada -- una descripción que no es un
   resorte no se convierte en el resorte más parecido.

   `material` es la fila del catálogo y es opcional. Sin él no se aplica el
   tope: con temple en aceite de .177" esto devolvía la SIMPLEX MC 50, que no
   puede correrlo, y la pieza se cotizaba a un cuarto de lo que cuesta en la
   máquina que sí. Quien llame debería pasarlo siempre que lo tenga. */
function bobinadora(descripcion, diaIn, maquinas, material) {
  const tipo = SG_TIPO[descripcion];
  if (!tipo) return null;
  const cap = SG_CAP[tipo], orden = SG_ORDEN[tipo] || [];
  const dmm = diaIn * 25.4;
  const capaces = (maquinas || []).filter(m =>
    m.family === 'COILER' && !m.excluded && m[cap] &&
    m.wireMinMm && m.wireMaxMm && dmm >= m.wireMinMm && dmm <= m.wireMaxMm &&
    !topeDeMaterial(m, material, dmm));
  if (!capaces.length) return null;
  const puesto = m => {
    const i = orden.findIndex(n => _norm(n) === _norm(m.name));
    return i < 0 ? 99 : i;
  };
  return capaces.sort((a, b) => puesto(a) - puesto(b))[0];
}

function porNombre(nombre, maquinas) {
  return (maquinas || []).find(m => m.name === nombre) || null;
}

/* Las secundarias salen del plano, no de una lista por defecto.

   El horno va por material o porque el plano pida tratamiento térmico. NO por
   el acabado: un "Zinc Clear & Bake" lleva un horneado que hace el recubridor
   -- es literalmente uno de los servicios subcontratados -- no el horno de
   ISC. Buscar "bake" en el acabado metía el horno en casi todas las piezas de
   zinc, que son casi todas.

   Queda fuera el otro caso de Rodea, "resortes muy grandes": no dio umbral,
   así que no hay forma de decidirlo sin inventárselo. Lo añade una persona. */
function secundarias(descripcion, plano, materialCode) {
  const dw = plano || {}, ops = [];
  const campo = k => {
    const f = (dw.fields || []).find(x => x.key === k);
    return f ? String(f.value || '').toLowerCase() : '';
  };
  if (descripcion === 'Compression Spring') {
    if (/ground/.test(campo('endType')))
      ops.push({ m: 'Grinder A', why: 'the drawing calls for ground ends' });
  } else if (descripcion === 'Tension Spring') {
    ops.push({ m: 'Looping / Hooks', why: 'extension spring: hook forming' });
  } else {
    ops.push({ m: 'Bending / Kick', why: 'leg bending' });
  }
  const revision = (dw.feasibility || []).map(x => String(x.label || '').toLowerCase()).join(' | ');
  if (materialCode === 'SS177')
    ops.push({ m: 'Stationary Oven', why: '17-7 PH needs ageing' });
  else if (/heat treatment|stress relie|anneal/.test(revision))
    ops.push({ m: 'Stationary Oven', why: 'the drawing calls for heat treatment' });
  return ops;
}

/* --------------------------------------------------------------- embalaje */

/* La caja se elige por el peso TOTAL del tramo, así que otra cantidad puede
   significar otra caja -- o barriles. */
function embalaje(pesoLb, descripcion, cantidad, embalajes) {
  const wt = _num(pesoLb), qty = _num(cantidad);
  if (!wt || wt <= 0 || !qty || qty <= 0) return null;
  const tierWt = wt * qty;
  let id, objetivo;
  if (tierWt >= 400) { id = 'barrels no lids'; objetivo = 130; }
  else if (descripcion === 'Wire Form' && tierWt >= 30) { id = 'CHP12012'; objetivo = 15; }
  else if (tierWt >= 200) { id = 'COR121212U'; objetivo = 17; }
  else if (tierWt >= 60) { id = 'COR100803'; objetivo = 13; }
  else { id = 'COR11050'; objetivo = 11; }
  const lista = embalajes || [];
  if (!lista.some(x => x.id === id)) id = (lista[0] || {}).id || '';
  let ppb = Math.max(1, Math.round(objetivo / wt));
  const redondas = [1, 2, 5, 10, 25, 50, 100, 200, 250, 500, 1000, 2000, 2500,
                    5000, 10000, 25000, 50000];
  let mejor = redondas[0];
  redondas.forEach(n => { if (Math.abs(n - ppb) < Math.abs(mejor - ppb)) mejor = n; });
  ppb = Math.min(mejor, qty);
  return { id: id, ppb: ppb, boxWt: ppb * wt, tierWt: tierWt };
}

/* --------------------------------------------------------------- acabados */

function normAcabado(t) {
  return String(t || '').toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]/g, '');
}

/* El acabado del plano, traducido a servicio de recubrimiento.

   `tabla` son las grafías del historial de cotizaciones que tradujo Rodea. Un
   acabado que no esté NO se convierte en el más parecido: adivinar aquí es
   elegir a qué proveedor va la pieza y a qué precio.

   Segunda pasada: que el plano nombre EL SERVICIO tal cual. La tabla traduce
   lo que ISC tecleó en el pasado, y el plano habla otro idioma -- dice
   "PASSIVATED" donde el servicio se llama "Passivate". Eso no es adivinar: es
   la misma palabra. Lo que sí sería adivinar es un "ZINC" a secas. */
function servicioDelTexto(texto, tabla, subcontratistas) {
  const txt = String(texto || '');
  if (!txt) return null;
  const k = normAcabado(txt);
  const m = (tabla || {})[k];
  if (m) return Object.assign({ texto: txt }, m);
  const sinD = k.replace(/d$/, '');
  const serv = (subcontratistas || []).reduce((a, s) => a.concat(s.services || []), [])
    .find(x => { const n = normAcabado(x.service); return n === k || n === sinD; });
  if (serv) return { texto: txt, canonical: serv.service, service: serv.service, delPlano: true };
  return { texto: txt, desconocido: true };
}

/* --------------------------------------------------------------- clientes */

/* Primero exacto por nombre o por código; después por contención, que es lo
   que salva los "Inc." y los "& Co." de más o de menos. Devuelve null cuando
   no encuentra: quien llama decide si lo dice o lo calla. */
function buscarCliente(nombre, clientes) {
  const txt = String(nombre || '').trim();
  if (!txt) return null;
  const n = s => String(s).toUpperCase().replace(/[^A-Z0-9]/g, '');
  const cn = n(txt), lista = clientes || [];
  return lista.find(c => n(c.name) === cn || n(c.code) === cn) ||
         lista.find(c => cn && (n(c.name).includes(cn) || cn.includes(n(c.name)))) ||
         null;
}

/* ------------------------------------------------------------------ ruta */

/* La firma de una ruta: qué máquinas, a qué cadencia y con qué puesta a punto.
   Sirve para saber si lo que hay lo escribió la máquina o una persona. */
function firmaRuta(tramo) {
  return ((tramo && tramo.routing) || []).filter(o => o.machine)
    .map(o => o.machine + '@' + (o.pph || '') + '/' + (o.setupH || '')).join(' > ');
}

/* La ruta completa: bobinadora más secundarias.

   `maquinaElegida` es la del Spring Calculator cuando ya corrió: allí está
   además la geometría, así que aplica también el aviso de OD.

   `material` es la fila del catálogo, y con ella el tope por material se
   aplica aquí igual que allí. Antes no llegaba, y no era teórico: con temple en
   aceite de .177" esto ponía la SIMPLEX MC 50 -- el tope de Rodea son 4,2 mm --
   en vez de la AIM 3000. La MC 50 no puede correr ese alambre, y cuesta la
   cuarta parte por pieza: la oferta salía un 75 % por debajo de lo que cuesta
   hacerla. El aviso de "abre el Spring Calculator" protegía sólo a quien lo
   leyera. */
function sugerirRuta(pieza, maquinas, maquinaElegida, material) {
  const dia = _num(pieza.material && pieza.material.diaIn);
  if (!dia || dia <= 0)
    return { err: 'Enter the wire ø first (Material card) — the coiler choice depends on it.' };
  const fam = pieza.desc || 'Compression Spring';
  if (!SG_TIPO[fam])
    return { err: '“' + fam + '” is not a spring type, so there is no automatic ' +
                  'routing for it — add the operations by hand.' };
  const elegida = maquinaElegida ? porNombre(maquinaElegida, maquinas) : null;
  const cm = elegida || bobinadora(fam, dia, maquinas, material);
  if (!cm) return { err: 'No machine in the shop can coil ' + dia + '" wire for a ' + fam +
                         (material ? ' in ' + material.name : '') +
                         '. Above 0.375" there is no coiler at all: flag it for manual ' +
                         'routing instead of pricing it.' };
  /* El motivo no es adorno: dice con qué se decidió, y por tanto qué NO se
     comprobó. Sin material sigue avisando, porque entonces sigue siendo verdad. */
  const ops = [{ m: cm, pph: cm.pph,
    why: elegida ? 'chosen by the Spring Calculator (type, wire, OD and material)'
      : material ? 'preferred coiler that fits the wire and the material'
                 : 'preferred coiler that fits the wire — open the Spring ' +
                   'Calculator so the material cap is applied too' }];
  secundarias(fam, pieza.drawing, pieza.material && pieza.material.code).forEach(s => {
    const m = porNombre(s.m, maquinas);
    if (m) ops.push({ m: m, pph: m.pph, why: s.why });
  });
  return { fam: fam, ops: ops };
}

/* ------------------------------------------------------------ el veredicto */

/* Lo que impide aprobar, en una lista. Se calcula para poder enseñarlo ANTES
   del clic, no descubrirlo pulsando. */
function faltaParaAprobar(cotizacion) {
  const falta = [];
  if (!cotizacion) return ['no quote open'];
  if (!cotizacion.header || !cotizacion.header.customerCode) falta.push('the customer');
  const pns = cotizacion.pns || [];
  if (!pns.some(p => String(p.pn || '').trim())) falta.push('the part number');
  if (!pns.some(p => (p.tiers || []).some(t => _num(t.qty) > 0))) falta.push('at least one quantity');
  if (!pns.some(p => _num(p.material.weightLb) > 0)) falta.push('the weight per piece');
  if (!pns.some(p => (p.tiers || []).some(t => (t.routing || []).some(o => o.machine))))
    falta.push('a routing');
  return falta;
}

const REGLAS = { SG_TIPO, SG_CAP, SG_ORDEN, topeDeMaterial, bobinadora,
                 porNombre, secundarias,
                 embalaje, normAcabado, servicioDelTexto, buscarCliente,
                 firmaRuta, sugerirRuta, faltaParaAprobar };

/* Para Node. En el navegador `module` no existe y esto no hace nada. */
if (typeof module !== 'undefined' && module.exports) { module.exports = REGLAS; }
/* ===== fin de las reglas del taller ===== */

/* ===== RESORTES: generado desde nucleo/motor/resortes.js — no editar aqui ===== */
/* El calculo del resorte de ISC.

   Dado un resorte -- material, alambre, diametro, espiras, longitud libre --
   dice que fuerza da, si es fabricable, con que reservas, y en que bobinadora
   del taller sale. Es lo que decide el dictamen de factibilidad que la
   calculadora de precios necesita antes de dejar aprobar una oferta.

   POR QUE ESTA AQUI Y NO DENTRO DEL HTML
     Vivia dentro del Spring Engineering Calculator, y una copia hecha a mano
     vivia ademas en analisis/herramientas/motor.js, que llevaba tiempo rota
     sin que nadie lo notara. Dos copias del mismo calculo acaban dando dos
     dictamenes distintos para la misma pieza.

   LAS TABLAS NO ESTAN AQUI
     `MATERIALS`, `MACHINES` y `ORDEN_TALLER` salen del catalogo del nucleo, y
     `STATE` es de quien llame: en el navegador es el estado de la pantalla, y
     desde Node lo pone la herramienta. Se declaran vacios y se rellenan con
     `configurar()`; en el navegador los pisa directamente el HTML, que es lo
     que ya hacia cuando todo esto estaba dentro de el.

   Fuente unica: este fichero. El HTML lo lleva incrustado (`construir.py`).
   ========================================================================= */

/* Vacios a proposito: una llamada antes de tiempo falla donde se ve, y no con
   los datos de otra pieza. */
var MATERIALS = [];
var MACHINES = [];
var ORDEN_TALLER = {};
var STATE = { unit: 'in', comp: {}, ext: {}, tors: {} };

/* Las tablas del catalogo del nucleo, en la forma que usa este fichero.

   Vive aqui, en JavaScript, y no en el generador del HTML, porque hacen falta
   en los dos sitios: al construir la calculadora y al correr las herramientas
   desde Node. Escrito dos veces volveria a ser el problema que se acaba de
   quitar. */
function desdeCatalogo(cat) {
  const materiales = cat.matReference.map(r => ({
    id: r.id, name: r.name, astm: r.astm,
    G: r.G, E: r.E, density: r.densityKgM3, A: r.A, m: r.m,
    dMin: r.dMinMm, dMax: r.dMaxMm, tempMax: r.tempMaxC,
    shearFac: r.shearFac, bendFac: r.bendFac, costFac: r.costFac,
    fatigue: r.fatigue, note: r.note,
    codigo: r.codigo, alias: r.alias,
  }));

  /* Solo las de la hoja de Rodea: sin rango de alambre no hay forma de decidir
     si la pieza cabe. El resto del catalogo son centros de trabajo de
     operaciones secundarias, que esta aplicacion no elige. */
  const coil = cat.machines
    .filter(m => m.family === 'COILER' && m.wireMinMm)
    .sort((a, b) => a.rank - b.rank);

  const maquinas = coil.map(m => {
    /* "(FENN)" es como lo llama la contabilidad; en el taller es un TORIN.
       `_norm` de reglas.js hace que los dos nombres busquen la misma fila. */
    const name = m.name.replace('(FENN) ', '');
    /* La clase de setup es una lectura de las horas, no un dato aparte: se
       calcula para que no pueda contradecir a las horas con las que se cotiza. */
    const setup = m.setupH <= 2 ? 'Low' : (m.setupH <= 5 ? 'Medium' : 'High');
    /* Un tope por material bloquea la maquina, asi que manda sobre lo demas.
       Que no haya OD en la hoja no es un riesgo: es un dato que falta, y se
       dice tal cual para que nadie lo lea como "no tiene limite". */
    const risk = m.caps ? m.caps
      : (m.compSecondary ? 'compression needs a secondary operation'
        : (!m.odMaxMm ? 'no OD limit on record' : 'none on record'));
    return {
      id: name.toLowerCase().replace(/[^a-z0-9]/g, ''), name,
      wireMin: m.wireMinMm, wireMax: m.wireMaxMm,
      odMax: m.odMaxMm, odMin: m.odMinMm,
      compression: m.capC, extension: m.capE, torsion: m.capT, wireform: m.capW,
      compSecondary: m.compSecondary, rank: m.rank,
      pph: m.pph, setupH: m.setupH, rateH: m.costRateH, laborH: m.laborH,
      caps: m.caps, capMaterial: m.capMaterial, capWireMaxMm: m.capWireMaxMm,
      axes: m.uses, setup: setup,
      uses: m.uses + '. Usage rank ' + m.rank + ' of ' + coil.length + ' in 2026.',
      risk: risk,
    };
  });

  return { materiales, maquinas };
}

/* Las dos formas de nombrar un material.

   La cotizacion usa el codigo con el que se compra el alambre -- MW, OT,
   SS177 -- y el calculo del resorte usa el id de la constante de ingenieria --
   music, otemp, ss177. Un plano puede traer cualquiera de las dos, o el nombre
   escrito de otra forma.

   Estaba escrito dos veces, en direcciones opuestas: `SPRING_MAT` en la
   calculadora de precios y `_mm` en el Spring Calculator. Los alias salen
   ahora del catalogo, asi que anadir uno se hace en un sitio. */
function materialDelTexto(texto) {
  const t = String(texto || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!t) return null;
  const m = MATERIALS.find(x => (x.alias || []).indexOf(t) >= 0);
  return m ? m.id : null;
}

/* El codigo de compra de un material, para pedir su $/lb. */
function codigoDeMaterial(id) {
  const m = MATERIALS.find(x => x.id === id);
  return m ? m.codigo : null;
}

/* Las reglas del taller, para cuando hagan falta aquí.

   Hoy sólo el tope por material, que decide si una máquina puede correr un
   alambre de ese material. Vive en `reglas.js` porque la aplica también la ruta
   automática de la cotización, y una regla en dos ficheros son dos reglas.

   Se busca al usarla, no al cargar: en el navegador los dos van incrustados en
   la misma página y el orden lo decide `construir.py`; desde Node se pide. */
function _reglas() {
  if (typeof REGLAS !== 'undefined') return REGLAS;
  if (typeof require !== 'undefined') return require('./reglas.js');
  return null;
}

function configurar(o) {
  if (o.materiales) MATERIALS = o.materiales;
  if (o.maquinas) MACHINES = o.maquinas;
  if (o.orden) ORDEN_TALLER = o.orden;
  if (o.estado) STATE = o.estado;
}

/* ---------- 1. UNIT CONVERSION ---------------------------------------------- */
var CONV = {
  len:   {in:1/25.4,        mm:1},          // mm -> display
  force: {in:1/4.4482216,   mm:1},          // N  -> display
  stress:{in:0.14503774/1,  mm:1},          // MPa-> display (ksi in inch mode)
  rate:  {in:5.7101471,     mm:1},          // N/mm -> display
  moment:{in:0.0088507458,  mm:1}           // N.mm -> display
};
var ULBL = {
  in:{len:'in',force:'lbf',stress:'ksi',rate:'lbf/in',moment:'lbf·in',freq:'Hz'},
  mm:{len:'mm',force:'N',  stress:'MPa', rate:'N/mm',  moment:'N·mm', freq:'Hz'}
};
function toDisp(siVal,kind,u){ return siVal*CONV[kind][u]; }
function toSI(dispVal,kind,u){ return dispVal/CONV[kind][u]; }
function ul(kind){ return ULBL[STATE.unit][kind]; }

/* ---------- 4. END-CONDITION TABLE (compression) ---------------------------- */
var END_TYPES = {
  plain:        {label:'Plain',             endCoils:0, ground:false},
  plain_ground: {label:'Plain & Ground',    endCoils:1, ground:true },
  closed:       {label:'Squared (Closed)',  endCoils:2, ground:false},
  closed_ground:{label:'Squared & Ground',  endCoils:2, ground:true }
};

/* ---------- 6. HELPERS ----------------------------------------------------- */
var PI = Math.PI;
function getMat(id){ for(var i=0;i<MATERIALS.length;i++) if(MATERIALS[i].id===id) return MATERIALS[i];
  return MATERIALS[0]; }
function num(v){ v=parseFloat(v); return isFinite(v)?v:0; }
function f(v,d){ if(d===undefined)d=2;
  if(v===null||v===undefined||!isFinite(v)) return '—';
  return v.toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:0}); }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* tensile strength (MPa) from diameter (mm) using Sut = A / d^m */
function tensile(mat,d_mm){
  var dd=clamp(d_mm,0.05,30);
  return mat.A/Math.pow(dd,mat.m);
}
/* Wahl correction factor */
function wahl(C){ return (4*C-1)/(4*C-4) + 0.615/C; }
/* Bergstrasser correction factor */
function bergs(C){ return (4*C+2)/(4*C-3); }
/* curvature correction for bending (inner fibre) - torsion springs / hooks */
function kBendInner(C){ return (4*C*C-C-1)/(4*C*(C-1)); }

/* resolve mean diameter from a diameter value + mode + wire dia */
function resolveDia(mode,dia,d){
  if(mode==='OD')   return {D:dia-d,   OD:dia,     ID:dia-2*d};
  if(mode==='ID')   return {D:dia+d,   OD:dia+2*d, ID:dia};
  return {D:dia, OD:dia+d, ID:dia-d};               /* mean */
}

/* =====================================================================
   7. CALCULATION ENGINE
   ===================================================================== */

/* ---- 7a. COMPRESSION ------------------------------------------------- */
function calcCompression(I){
  var mat=getMat(I.matId), d=I.d, g=resolveDia(I.odMode,I.dia,d);
  var D=g.D, C=D/d, Na=I.Na, Nt=I.Nt, et=END_TYPES[I.endType];
  var Kw=wahl(C), Kb=bergs(C);
  var k = (mat.G*Math.pow(d,4))/(8*Math.pow(D,3)*Na);          /* N/mm */
  /* solid height */
  var Ls = et.ground ? d*Nt : d*(Nt+1);
  var L0=I.L0;
  /* pitch */
  var p;
  if(I.endType==='plain')        p=(L0-d)/Na;
  else if(I.endType==='plain_ground') p=L0/(Na+1);
  else if(I.endType==='closed')  p=(L0-3*d)/Na;
  else                           p=(L0-2*d)/Na;
  var helix = Math.atan(p/(PI*D))*180/PI;
  /* deflections & loads */
  var fSolid = L0-Ls;
  var Fsolid = k*fSolid;
  var defl   = L0-I.h;                       /* deflection at working height */
  var Fwork  = k*defl;
  var Sut=tensile(mat,d);
  var tauAllow = mat.shearFac*Sut;
  var tauWork  = Kw*8*Fwork*D /(PI*Math.pow(d,3));
  var tauSolid = Kw*8*Fsolid*D/(PI*Math.pow(d,3));
  var SFwork = tauAllow/tauWork;
  var SFsolid= tauAllow/tauSolid;
  var stressPctSolid = tauSolid/Sut*100;
  /* natural frequency (both ends fixed) fn = 0.5*sqrt(k/m) */
  var wireLen = PI*D*Na;                                  /* mm */
  var vol = (PI*d*d/4)*wireLen;                           /* mm^3 */
  var mass = vol*1e-9*mat.density;                        /* kg */
  var fn = 0.5*Math.sqrt((k*1000)/mass);                  /* Hz */
  /* buckling - critical deflection */
  var alpha = et.ground?0.5:0.707;
  var lamEff = alpha*L0/D;
  var C1 = mat.E/(2*(mat.E-mat.G));
  var C2 = 2*PI*PI*(mat.E-mat.G)/(2*mat.G+mat.E);
  var inside = 1 - C2/(lamEff*lamEff);
  var yCrit, absStable=false;
  if(inside<=0){ yCrit=Infinity; absStable=true; }          /* never buckles */
  else { yCrit = L0*C1*(1-Math.sqrt(inside)); }
  var bucklePct = absStable?0:(defl/yCrit*100);
  var slender = L0/D;
  var wireLenTot=PI*D*Nt/Math.cos(helix*PI/180);
  var partWeightKg=(PI*d*d/4)*wireLenTot*1e-9*mat.density;
  return {mat:mat,d:d,D:D,OD:g.OD,ID:g.ID,C:C,Na:Na,Nt:Nt,Kw:Kw,Kb:Kb,k:k,
    Ls:Ls,L0:L0,p:p,helix:helix,fSolid:fSolid,Fsolid:Fsolid,defl:defl,Fwork:Fwork,
    Sut:Sut,tauAllow:tauAllow,tauWork:tauWork,tauSolid:tauSolid,
    SFwork:SFwork,SFsolid:SFsolid,stressPctSolid:stressPctSolid,
    fn:fn,mass:mass,yCrit:yCrit,absStable:absStable,bucklePct:bucklePct,
    slender:slender,alpha:alpha,h:I.h,partWeightKg:partWeightKg,wireLenTot:wireLenTot};
}

/* ---- 7b. EXTENSION --------------------------------------------------- */
function calcExtension(I){
  var mat=getMat(I.matId), d=I.d, g=resolveDia(I.odMode,I.dia,d);
  var D=g.D, C=D/d, Na=I.Na, Kw=wahl(C);
  var k=(mat.G*Math.pow(d,4))/(8*Math.pow(D,3)*Na);          /* N/mm */
  var Fi=I.Fi, x=I.x;
  var F=Fi+k*x;
  var Sut=tensile(mat,d);
  var tauAllow=mat.shearFac*Sut;
  var sigAllow=mat.bendFac*Sut;
  /* body stress */
  var tauBody=Kw*8*F*D/(PI*Math.pow(d,3));
  /* uncorrected initial-tension stress */
  var tauI=8*Fi*D/(PI*Math.pow(d,3));
  /* preferred initial-tension torsional-stress band (SMI), psi -> MPa */
  var tauIprefPsi = 33500/Math.exp(0.105*C);
  var bandPsi = 1000*(4-(C-3)/6.5); if(bandPsi<0) bandPsi=0;
  var tauIpref   = tauIprefPsi*0.00689476;
  var tauIbandLo = (tauIprefPsi-bandPsi)*0.00689476;
  var tauIbandHi = (tauIprefPsi+bandPsi)*0.00689476;
  /* hook stresses */
  var r1=I.r1>0?I.r1:D/2, r2=I.r2>0?I.r2:D/2;
  var C1h=2*r1/d, C2h=2*r2/d;
  var K1 = C1h>1.05 ? (4*C1h*C1h-C1h-1)/(4*C1h*(C1h-1)) : 1.25;
  var K2 = C2h>1.05 ? (4*C2h-1)/(4*C2h-4) : 1.25;
  var sigHookA = F*( K1*16*D/(PI*Math.pow(d,3)) + 4/(PI*d*d) );  /* bending at body-to-hook */
  var tauHookB = K2*8*F*D/(PI*Math.pow(d,3));                    /* torsion at hook bend */
  /* safety factors */
  var SFbody = tauAllow/tauBody;
  var SFhookA= sigAllow/sigHookA;
  var SFhookB= tauAllow/tauHookB;
  /* max safe extension - governed by lowest-capacity location */
  var Fbody  = tauAllow*PI*Math.pow(d,3)/(Kw*8*D);
  var FhookB = tauAllow*PI*Math.pow(d,3)/(K2*8*D);
  var FhookA = sigAllow/( K1*16*D/(PI*Math.pow(d,3)) + 4/(PI*d*d) );
  var Fcap=Math.min(Fbody,FhookA,FhookB);
  var govName = Fcap===Fbody?'spring body':(Fcap===FhookA?'hook bend (point A)':'hook bend (point B)');
  var xMax=(Fcap-Fi)/k;
  /* hook developed length: loop of mean radius r1, turns set by hook style */
  var hookTurns=({machine_full:1.0,machine_half:0.55,crossover:1.15,side:1.05,extended:1.7,special:1.2})[I.hookType]||1.0;
  var hookDevLen=hookTurns*2*PI*r1;
  var wireLenTot=PI*D*Na+2*hookDevLen;
  var partWeightKg=(PI*d*d/4)*wireLenTot*1e-9*mat.density;
  return {mat:mat,d:d,D:D,OD:g.OD,ID:g.ID,C:C,Na:Na,Kw:Kw,k:k,Fi:Fi,x:x,F:F,
    Sut:Sut,tauAllow:tauAllow,sigAllow:sigAllow,tauBody:tauBody,tauI:tauI,
    tauIpref:tauIpref,tauIbandLo:tauIbandLo,tauIbandHi:tauIbandHi,
    r1:r1,r2:r2,K1:K1,K2:K2,sigHookA:sigHookA,tauHookB:tauHookB,
    SFbody:SFbody,SFhookA:SFhookA,SFhookB:SFhookB,
    xMax:xMax,Fcap:Fcap,govName:govName,bodyLen:I.bodyLen,hookType:I.hookType,partWeightKg:partWeightKg,wireLenTot:wireLenTot};
}

/* ---- 7c. TORSION ----------------------------------------------------- */
function calcTorsion(I){
  var mat=getMat(I.matId), d=I.d, g=resolveDia(I.odMode,I.dia,d);
  var D=g.D, C=D/d, Nb=I.Nb;
  /* active coils incl. leg contribution (two legs of equal length assumed) */
  var Ne=(2*I.legLen)/(3*PI*D);
  var Na=Nb+Ne;
  var Ki=kBendInner(C);
  /* angular rate: moment per revolution (10.8 empirical incl. friction) */
  var kRev=(mat.E*Math.pow(d,4))/(10.8*D*Na);     /* N.mm / rev */
  var kDeg=kRev/360;                              /* N.mm / deg */
  var ang=I.angle;
  var M=kDeg*ang;                                 /* N.mm at given angle */
  var Sut=tensile(mat,d);
  var sigAllow=mat.bendFac*Sut;
  var sigma=Ki*32*M/(PI*Math.pow(d,3));           /* bending stress, inner fibre */
  var SF=sigAllow/sigma;
  /* safe angular deflection */
  var sigPerDeg=Ki*32*kDeg/(PI*Math.pow(d,3));
  var angSafe=sigAllow/sigPerDeg;
  /* diameter change under load */
  var angRev=ang/360;
  var Dload, idLoad;
  if(I.loadDir==='closing'){ Dload=D*Nb/(Nb+angRev); }
  else                     { Dload=D*Nb/Math.max(Nb-angRev,0.01); }
  idLoad=Dload-d;
  var mandrelClear=idLoad-I.mandrel;
  var mandrelRec=0.90*idLoad;
  /* body length */
  var bodyLen=d*(Nb+1);
  var wireLenTot=PI*D*Nb+2*I.legLen;
  var partWeightKg=(PI*d*d/4)*wireLenTot*1e-9*mat.density;
  return {mat:mat,d:d,D:D,OD:g.OD,ID:g.ID,C:C,Nb:Nb,Ne:Ne,Na:Na,Ki:Ki,
    kRev:kRev,kDeg:kDeg,angle:ang,M:M,Sut:Sut,sigAllow:sigAllow,sigma:sigma,SF:SF,
    angSafe:angSafe,Dload:Dload,idLoad:idLoad,mandrel:I.mandrel,
    mandrelClear:mandrelClear,mandrelRec:mandrelRec,bodyLen:bodyLen,
    windDir:I.windDir,loadDir:I.loadDir,legLen:I.legLen,partWeightKg:partWeightKg,wireLenTot:wireLenTot};
}

/* =====================================================================
   8. MANUFACTURABILITY SCORING  -> {score, flags:[{level,title,rec}]}
   level: crit | warn | info | ok
   ===================================================================== */
function scoreCommon(flags,d,mat){
  var pen=0;
  if(d<mat.dMin||d>mat.dMax){
    pen+=15;
    flags.push({level:'warn',title:'Wire diameter outside material data range',
      rec:'Wire ø '+f(toDisp(d,'len',STATE.unit),3)+' '+ul('len')+
      ' is outside the validated range for '+mat.name+
      ' ('+f(toDisp(mat.dMin,'len',STATE.unit),3)+'–'+
      f(toDisp(mat.dMax,'len',STATE.unit),3)+' '+ul('len')+
      '). Tensile-strength estimate is extrapolated — confirm with the wire supplier.'});
  }
  return pen;
}
function bandFromScore(s){
  if(s>=90) return {band:'Easy to manufacture',  color:'#1f8a4c',
    desc:'Design sits well inside normal shop limits.'};
  if(s>=70) return {band:'Manufacturable',       color:'#3f9e57',
    desc:'Producible with normal process controls.'};
  if(s>=50) return {band:'Engineering review',   color:'#b9770e',
    desc:'Requires engineering review before quoting / release.'};
  if(s>=30) return {band:'High manufacturing risk',color:'#d35400',
    desc:'Significant risk — expect yield loss and added cost.'};
  return {band:'Not recommended',color:'#c0392b',
    desc:'Design is at or beyond practical limits — redesign advised.'};
}

function scoreCompression(R){
  var flags=[], pen=0, mat=R.mat;
  /* Un 100 sin punto de trabajo no es un resorte impecable: es un resorte
     que nadie ha podido evaluar. Se dice antes que nada. */
  if(!(R.h>0)) flags.push({level:'info',
    title:'Working stress, buckling and set not evaluated',
    rec:'The drawing gives no working point, so there is no deflection to evaluate. The score below covers geometry and coilability only \u2014 not how the spring behaves in service.'});
  /* spring index */
  if(R.C<4){ pen+=26; flags.push({level:'crit',title:'Spring index too low (C = '+f(R.C,2)+')',
    rec:'C below 4 is very hard to coil, causes high coiling stress and tool wear. Increase mean diameter or reduce wire diameter to bring C into 5–12.'}); }
  else if(R.C<5){ pen+=10; flags.push({level:'warn',title:'Spring index low (C = '+f(R.C,2)+')',
    rec:'C of 4–5 is coilable but stresses tooling. Aim for 5–12 where practical.'}); }
  else if(R.C>15){ pen+=20; flags.push({level:'crit',title:'Spring index too high (C = '+f(R.C,2)+')',
    rec:'C above 15 gives a slack, tangle-prone coil with inconsistent free length. Reduce mean diameter or increase wire diameter.'}); }
  else if(R.C>12){ pen+=8; flags.push({level:'warn',title:'Spring index high (C = '+f(R.C,2)+')',
    rec:'C of 12–15 risks tangling and free-length scatter. Tighten toward 5–12 if the envelope allows.'}); }
  else flags.push({level:'ok',title:'Spring index in ideal range (C = '+f(R.C,2)+')',rec:''});
  /* wire vs material range */
  pen+=scoreCommon(flags,R.d,mat);
  /* geometry consistency */
  if(R.ID<=0){ pen+=40; flags.push({level:'crit',title:'OD / ID conflict',
    rec:'Inside diameter computes to zero or negative. Check wire diameter and the entered diameter / mode.'}); }
  if(R.L0<=R.Ls){ pen+=40; flags.push({level:'crit',title:'Free length ≤ solid height',
    rec:'Free length must exceed solid height ('+f(toDisp(R.Ls,'len',STATE.unit),3)+' '+ul('len')+'). The spring has no working travel — revise free length or coil count.'}); }
  else if(R.h>0&&R.h<R.Ls){ pen+=22; flags.push({level:'crit',title:'Working height below solid height',
    rec:'Working height '+f(toDisp(R.h,'len',STATE.unit),3)+' '+ul('len')+' is below solid height. The spring is over-travelled — it will be forced past solid.'}); }
  /* stress / safety - working load is the primary check.
     Sin altura de trabajo no hay deflexion, y sin deflexion la tension no
     significa nada: se salta en vez de penalizar sobre un supuesto. */
  if(R.h>0&&R.SFwork<1){ pen+=36; flags.push({level:'crit',title:'Overstressed at working load (SF = '+f(R.SFwork,2)+')',
    rec:'Operating stress exceeds the allowable shear stress — the spring yields in normal use. Increase wire diameter, raise the spring index, or add active coils.'}); }
  else if(R.h>0&&R.SFwork<1.2){ pen+=18; flags.push({level:'warn',title:'Low safety factor at working load (SF = '+f(R.SFwork,2)+')',
    rec:'Operating stress is close to the allowable. Target SF ≥ 1.2 static, higher for cyclic / fatigue duty.'}); }
  else if(R.h>0&&R.SFwork<1.5){ pen+=6; flags.push({level:'info',title:'Moderate working safety factor (SF = '+f(R.SFwork,2)+')',
    rec:'Adequate for static duty. For cyclic or fatigue loading aim for SF ≥ 1.5.'}); }
  /* solid-stress check - secondary: many springs are not designed to go solid */
  if(R.SFsolid<1){ pen+=12; flags.push({level:'warn',title:'Spring takes a set if compressed solid (SF = '+f(R.SFsolid,2)+')',
    rec:'Solid stress exceeds the allowable. Acceptable only if the spring is never compressed fully solid in service; otherwise preset (cold-set) the spring or add capacity.'}); }
  /* buckling: tambien va con la deflexion de trabajo */
  if(R.h>0&&!R.absStable){
    if(R.bucklePct>=100){ pen+=24; flags.push({level:'crit',title:'Buckling expected at working deflection',
      rec:'Working deflection exceeds the critical buckling deflection. Use a guide rod or bore, reduce free length, or increase mean diameter.'}); }
    else if(R.bucklePct>=70){ pen+=12; flags.push({level:'warn',title:'Buckling risk ('+f(R.bucklePct,0)+'% of critical deflection)',
      rec:'Approaching the buckling limit. Consider a guide rod / bore or a shorter, larger-diameter spring.'}); }
  }
  if(R.slender>5.3){ flags.push({level:'info',title:'Slender spring (L0 / D = '+f(R.slender,1)+')',
    rec:'Slenderness above ~5 makes buckling sensitive to end conditions. Squared & ground ends and a guide are advisable.'}); }
  /* pitch / helix */
  if(R.helix>12){ pen+=10; flags.push({level:'warn',title:'Helix angle high ('+f(R.helix,1)+'°)',
    rec:'Helix angle above ~12° reduces coiling accuracy and the rate formula loses precision. Add coils or reduce free length.'}); }
  if(R.p<=R.d){ pen+=8; flags.push({level:'warn',title:'Pitch at or below wire diameter',
    rec:'Coils touch or overlap at free length. Increase free length or reduce coil count.'}); }
  /* coil count */
  if(R.Na<3){ pen+=10; flags.push({level:'warn',title:'Few active coils (Na = '+f(R.Na,1)+')',
    rec:'Below ~3 active coils the rate is hard to hold and end effects dominate. Add coils if the envelope allows.'}); }
  /* grinding feasibility */
  if(END_TYPES[STATE.comp.endType].ground){
    if(R.C>13){ pen+=6; flags.push({level:'warn',title:'Grinding feasibility risk',
      rec:'High index + ground ends: slender coils can deflect during grinding, hurting squareness and load tolerance.'}); }
    else flags.push({level:'info',title:'Ends are ground — secondary grinding operation required',
      rec:'Include end-grinding in routing and cost. Verify squareness and parallelism tolerances are achievable.'});
  }
  var score=clamp(Math.round(100-pen),0,100);
  return {score:score,flags:flags};
}

function scoreExtension(R){
  var flags=[],pen=0,mat=R.mat;
  if(R.C<4){ pen+=24; flags.push({level:'crit',title:'Spring index too low (C = '+f(R.C,2)+')',
    rec:'Low index is hard to coil and over-stresses tooling. Increase mean diameter or reduce wire diameter.'}); }
  else if(R.C<5){ pen+=9; flags.push({level:'warn',title:'Spring index low (C = '+f(R.C,2)+')',
    rec:'Coilable but hard on tooling. Aim for 5–12.'}); }
  else if(R.C>15){ pen+=18; flags.push({level:'crit',title:'Spring index too high (C = '+f(R.C,2)+')',
    rec:'Very high index gives an unstable, tangle-prone coil. Reduce mean diameter or increase wire diameter.'}); }
  else if(R.C>12){ pen+=7; flags.push({level:'warn',title:'Spring index high (C = '+f(R.C,2)+')',
    rec:'Tighten toward 5–12 to improve consistency.'}); }
  else flags.push({level:'ok',title:'Spring index in ideal range (C = '+f(R.C,2)+')',rec:''});
  pen+=scoreCommon(flags,R.d,mat);
  /* initial tension band */
  if(R.tauI<R.tauIbandLo){ pen+=10; flags.push({level:'warn',title:'Initial tension below preferred band',
    rec:'Coiled-in stress '+f(toDisp(R.tauI,'stress',STATE.unit),1)+' '+ul('stress')+
    ' is under the preferred range ('+f(toDisp(R.tauIbandLo,'stress',STATE.unit),1)+'–'+
    f(toDisp(R.tauIbandHi,'stress',STATE.unit),1)+' '+ul('stress')+'). Low initial tension is hard to hold consistently in production.'}); }
  else if(R.tauI>R.tauIbandHi){ pen+=14; flags.push({level:'warn',title:'Initial tension above preferred band',
    rec:'Coiled-in stress exceeds the preferred range. High initial tension is difficult to coil and may relax in service. Reduce it or accept tighter process control.'}); }
  else flags.push({level:'ok',title:'Initial tension within preferred band',rec:''});
  /* hook stresses - extension springs usually fail at the hook */
  var SFhook=Math.min(R.SFhookA,R.SFhookB);
  if(SFhook<1){ pen+=32; flags.push({level:'crit',title:'Hook overstressed (SF = '+f(SFhook,2)+')',
    rec:'Stress at the hook exceeds the allowable — hooks are the usual failure point. Increase the hook bend radius, reduce load, or use a heavier wire.'}); }
  else if(SFhook<1.5){ pen+=16; flags.push({level:'warn',title:'Low hook safety factor (SF = '+f(SFhook,2)+')',
    rec:'Hooks carry a stress concentration. Target SF ≥ 1.5 static and well above that for cyclic duty. Increase the bend radius.'}); }
  if(R.sigHookA>R.tauBody*1.25 || R.tauHookB>R.tauBody*1.25){
    flags.push({level:'info',title:'Hook is the limiting feature',
    rec:'Hook stress exceeds body stress — fatigue cracks will start at the hook. Generous bend radii and stress-relief help.'}); }
  if(R.SFbody<1.2 && R.SFbody>=0){ pen+=14; flags.push({level:'warn',title:'Low body safety factor (SF = '+f(R.SFbody,2)+')',
    rec:'Body operating stress is high. Target SF ≥ 1.2 static.'}); }
  /* hook-forming complexity */
  var hookPen={machine_full:0,machine_half:0,crossover:5,side:4,extended:8,special:12};
  var hp=hookPen[R.hookType]||0;
  if(hp>0){ pen+=hp; flags.push({level:'warn',title:'Hook type adds forming complexity',
    rec:'The selected hook style needs extra forming / secondary operations. Standard machine loops are the most economical and repeatable.'}); }
  /* set removal not possible */
  flags.push({level:'info',title:'Close-wound body — set cannot be removed',
    rec:'Extension springs are coiled solid, so cold-set / preset is not available. Keep body stress conservative.'});
  var score=clamp(Math.round(100-pen),0,100);
  return {score:score,flags:flags};
}

function scoreTorsion(R){
  var flags=[],pen=0,mat=R.mat;
  if(R.C<4){ pen+=24; flags.push({level:'crit',title:'Spring index too low (C = '+f(R.C,2)+')',
    rec:'Low index over-stresses coiling tooling and raises bending stress. Increase mean diameter or reduce wire diameter.'}); }
  else if(R.C<5){ pen+=9; flags.push({level:'warn',title:'Spring index low (C = '+f(R.C,2)+')',
    rec:'Coilable but hard on tooling. Aim for 5–12.'}); }
  else if(R.C>15){ pen+=18; flags.push({level:'crit',title:'Spring index too high (C = '+f(R.C,2)+')',
    rec:'High index gives a loose, unstable coil. Reduce mean diameter or increase wire diameter.'}); }
  else if(R.C>12){ pen+=7; flags.push({level:'warn',title:'Spring index high (C = '+f(R.C,2)+')',
    rec:'Tighten toward 5–12 for consistency.'}); }
  else flags.push({level:'ok',title:'Spring index in ideal range (C = '+f(R.C,2)+')',rec:''});
  pen+=scoreCommon(flags,R.d,mat);
  /* direction of wind / load */
  if(R.loadDir==='opening'){ pen+=22; flags.push({level:'crit',title:'Load unwinds the spring',
    rec:'Torsion springs must be loaded in the direction that winds them tighter (closing). Loading in the opening direction over-stresses the wire and loosens the coil over the mandrel. Reverse the wind direction or the load direction.'}); }
  else flags.push({level:'ok',title:'Load winds the spring closed (correct direction)',rec:''});
  /* stress / safety */
  if(R.SF<1){ pen+=34; flags.push({level:'crit',title:'Bending stress exceeds allowable (SF = '+f(R.SF,2)+')',
    rec:'The wire yields at the working angle. Increase wire diameter, raise index, or reduce the angle of rotation.'}); }
  else if(R.SF<1.2){ pen+=15; flags.push({level:'warn',title:'Low safety factor (SF = '+f(R.SF,2)+')',
    rec:'Operating bending stress is close to the allowable. Target SF ≥ 1.2 static, higher for cyclic duty.'}); }
  if(R.angle>R.angSafe){ pen+=20; flags.push({level:'crit',title:'Angle of rotation exceeds safe deflection',
    rec:'Working angle '+f(R.angle,0)+'° is beyond the safe '+f(R.angSafe,0)+'°. Reduce the angle or increase capacity.'}); }
  /* mandrel clearance */
  if(R.idLoad<=0){ pen+=20; flags.push({level:'crit',title:'Coil closes onto itself under load',
    rec:'Inside diameter under load computes to zero. Coil count or angle is excessive.'}); }
  else if(R.mandrelClear<0){ pen+=24; flags.push({level:'crit',title:'Mandrel interference under load',
    rec:'The coil ID shrinks to '+f(toDisp(R.idLoad,'len',STATE.unit),3)+' '+ul('len')+
    ' under load — smaller than the '+f(toDisp(R.mandrel,'len',STATE.unit),3)+' '+ul('len')+
    ' mandrel. The spring binds. Use a mandrel ≤ '+f(toDisp(R.mandrelRec,'len',STATE.unit),3)+' '+ul('len')+'.'}); }
  else if(R.mandrel>R.mandrelRec){ pen+=10; flags.push({level:'warn',title:'Tight mandrel clearance',
    rec:'Mandrel is above the recommended 90% of loaded ID. Drop to ≤ '+
    f(toDisp(R.mandrelRec,'len',STATE.unit),3)+' '+ul('len')+' to avoid binding and friction.'}); }
  else flags.push({level:'ok',title:'Mandrel clearance adequate',rec:''});
  /* leg manufacturability */
  if(R.legLen>2.5*R.D){ pen+=6; flags.push({level:'warn',title:'Long legs',
    rec:'Legs longer than ~2.5× mean diameter deflect under load and may need support or a heavier section. Confirm leg geometry with the customer.'}); }
  if(R.Nb<3){ pen+=8; flags.push({level:'warn',title:'Few body coils (Nb = '+f(R.Nb,1)+')',
    rec:'Below ~3 body coils the rate is dominated by the legs and is hard to hold. Add coils if possible.'}); }
  flags.push({level:'info',title:'Leg forming is a secondary operation',
    rec:'Account for leg bending / end forming in routing and cost. Sharp leg bends concentrate stress — use generous radii.'});
  var score=clamp(Math.round(100-pen),0,100);
  return {score:score,flags:flags};
}

   9. MACHINE SELECTION
   ===================================================================== */
function selectMachine(type,d,OD,matId){
  /* Los seis pasos de la hoja de Rodea, en su orden. Antes esto puntuaba con un
     criterio propio -- posicion del alambre en el rango, clase de setup -- y no
     miraba siquiera si la maquina hace ese tipo de resorte. De ahi salia que la
     Nucoil CSF-200, que solo hace tension, torsion y wire form, se recomendara
     para resortes de compresion. */
  var orden = ORDEN_TALLER[type==='extension'?'extension':type] || [];
  var puesto = function(nombre){
    var i = orden.indexOf(nombre);
    return i<0 ? 99 : i;              /* fuera de la lista: al final */
  };
  var cand=[], near=[];
  for(var i=0;i<MACHINES.length;i++){
    var m=MACHINES[i];
    if(!m[type]) continue;                       /* 1. tipo permitido */
    var notas=[], falla=[];
    /* 2. diametro de alambre: esto SI bloquea */
    if(d<m.wireMin) falla.push('wire \u00f8 below min ('+f(toDisp(m.wireMin,'len',STATE.unit),3)+' '+ul('len')+')');
    if(d>m.wireMax) falla.push('wire \u00f8 above max ('+f(toDisp(m.wireMax,'len',STATE.unit),3)+' '+ul('len')+')');
    /* 3. el OD maximo AVISA, no bloquea -- y un OD sin declarar no restringe.
       Once de las 18 no lo tienen; compararlo contra null las descartaba todas. */
    if(m.odMax && OD>m.odMax)
      notas.push('OD above the machine maximum ('+f(toDisp(m.odMax,'len',STATE.unit),2)+' '+ul('len')+')');
    else if(m.odMax && OD>m.odMax*0.85) notas.push('OD near machine maximum');
    if(m.odMin && OD<m.odMin)
      notas.push('OD below the machine minimum ('+f(toDisp(m.odMin,'len',STATE.unit),2)+' '+ul('len')+')');
    /* 4. tope por material: hoy solo la MC 50 con temple en aceite.
       Sale de `capMaterial` y `capWireMaxMm`, no de leer la frase de Rodea con
       una expresion regular: la misma regla la aplica `bobinadora()` en la ruta
       de la cotizacion, y una frase leida en dos sitios se lee distinto. */
    var _r = _reglas();
    var _tope = _r ? _r.topeDeMaterial(m, getMat(matId), d) : null;
    if(_tope) falla.push(_tope);
    if(d<m.wireMin*1.15||d>m.wireMax*0.85) notas.push('wire \u00f8 near a machine limit');
    if(m.compSecondary && type==='compression')
      notas.push('compression on this machine needs a secondary operation');
    if(falla.length){ near.push({m:m,why:falla}); continue; }
    cand.push({m:m,score:100-puesto(m.name),notes:notas,pos:puesto(m.name)});
  }
  /* 5. gana la preferida del taller entre las que pasan */
  cand.sort(function(a,b){return a.pos-b.pos;});
  /* 6. si ninguna pasa, `feasible:false` y `near` dice por que. No se adivina. */
  return {feasible:cand.length>0,best:cand[0]||null,alt:cand[1]||null,all:cand,near:near};
}

var app=document.getElementById('app');

function lgraph(title,xLab,yLab,xEnd,yEnd,xw,yw,xStart,yStart){
  xStart=xStart||0; yStart=yStart||0;
  if(!isFinite(xEnd))xEnd=0; if(!isFinite(yEnd))yEnd=0;
  if(!isFinite(xw))xw=0; if(!isFinite(yw))yw=0; if(!isFinite(yStart))yStart=0;
  var W=340,H=216,mL=54,mR=16,mT=26,mB=34;
  var pw=W-mL-mR, ph=H-mT-mB;
  var xmax=Math.max(xEnd,xw,0.0001)*1.06;
  var ymax=Math.max(yEnd,yw,yStart,0.0001)*1.10;
  function X(x){ return mL+(x/xmax)*pw; }
  function Y(y){ return mT+ph-(y/ymax)*ph; }
  var s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  s+='<text x="'+(W/2)+'" y="14" font-size="11" font-weight="700" fill="#1f5fa8" text-anchor="middle">'+title+'</text>';
  s+='<rect x="'+mL+'" y="'+mT+'" width="'+pw+'" height="'+ph+'" fill="#f7f9fb" stroke="#cdd4de"/>';
  for(var g=1;g<4;g++){
    var gy=mT+ph*g/4, gx=mL+pw*g/4;
    s+='<line x1="'+mL+'" y1="'+gy+'" x2="'+(mL+pw)+'" y2="'+gy+'" stroke="#e8ebef"/>';
    s+='<line x1="'+gx+'" y1="'+mT+'" x2="'+gx+'" y2="'+(mT+ph)+'" stroke="#e8ebef"/>';
  }
  s+='<line x1="'+X(xStart)+'" y1="'+Y(yStart)+'" x2="'+X(xEnd)+'" y2="'+Y(yEnd)+'" stroke="#1f5fa8" stroke-width="2.6" stroke-linecap="round"/>';
  s+='<line x1="'+X(xw)+'" y1="'+Y(0)+'" x2="'+X(xw)+'" y2="'+Y(yw)+'" stroke="#d67c2f" stroke-width="1" stroke-dasharray="3 2"/>';
  s+='<line x1="'+X(0)+'" y1="'+Y(yw)+'" x2="'+X(xw)+'" y2="'+Y(yw)+'" stroke="#d67c2f" stroke-width="1" stroke-dasharray="3 2"/>';
  s+='<circle cx="'+X(xw)+'" cy="'+Y(yw)+'" r="4.5" fill="#d67c2f"/>';
  s+='<text x="'+(X(xw)+6)+'" y="'+(Y(yw)-6)+'" font-size="9" fill="#b9770e" font-weight="700">operating point</text>';
  s+='<text x="'+(mL+pw/2)+'" y="'+(H-5)+'" font-size="9" fill="#5a6577" text-anchor="middle">'+xLab+'</text>';
  s+='<text x="11" y="'+(mT+ph/2)+'" font-size="9" fill="#5a6577" text-anchor="middle" transform="rotate(-90 11 '+(mT+ph/2)+')">'+yLab+'</text>';
  s+='<text x="'+mL+'" y="'+(mT+ph+12)+'" font-size="8" fill="#5a6577" text-anchor="middle">0</text>';
  s+='<text x="'+(mL+pw)+'" y="'+(mT+ph+12)+'" font-size="8" fill="#5a6577" text-anchor="end">'+f(xmax,2)+'</text>';
  s+='<text x="'+(mL-5)+'" y="'+(mT+ph+3)+'" font-size="8" fill="#5a6577" text-anchor="end">0</text>';
  s+='<text x="'+(mL-5)+'" y="'+(mT+7)+'" font-size="8" fill="#5a6577" text-anchor="end">'+f(ymax,1)+'</text>';
  s+='</svg>';
  return s;
}

/* ===================== COMPRESSION ===================== */
function maquinaActual(){
  /* La maquina que corresponde a la pestana abierta. Se calcula al vuelo para
     que la etiqueta no dependa de que ya se haya enviado el mensaje. */
  try{
    var I=(STATE.tab==='compression')?STATE.comp:
          (STATE.tab==='extension')?STATE.ext:STATE.tors;
    if(!(I.d>0&&I.dia>0)) return null;
    var g=resolveDia(I.odMode,I.dia,I.d);
    var sel=selectMachine(STATE.tab,I.d,g.OD,I.matId);
    return {feasible:!!sel.feasible,
            best:(sel.best&&sel.best.m)?sel.best.m.name:(sel.best?sel.best.name:null),
            why:(!sel.feasible&&sel.near&&sel.near[0])?sel.near[0].why.join(', '):''};
  }catch(e){ return null; }
}

function verdictoHTML(){
  var maq=maquinaActual();
  var V=verdictoFinal(maq);
  if(!V) return '';
  var rev=V.verdict!=='FEASIBLE';
  var h='<div class="vdt '+(rev?'rv':'go')+'">'+
        '<span class="tg">'+V.verdict+'</span><div>';
  if(rev){
    h+='<b>Quote it after someone checks:</b><ul>';
    for(var i=0;i<V.reasons.length;i++) h+='<li>'+esc(V.reasons[i])+'</li>';
    h+='</ul>';
  } else {
    /* La misma frase que el cotizador: no se afirma que el plano este
       completo -- puede faltar la altura de trabajo y aun asi cotizarse --
       sino que esta lo que hace falta para cotizar, que es lo comprobado. */
    h+='<b>Everything needed to quote is on the drawing and consistent'+
       (maq&&maq.best?', and '+esc(maq.best)+' can make it':'')+'.</b> '+
       'Engineering findings below are remarks, not blockers.';
  }
  return h+'</div></div>';
}

function verdictoFinal(maq){
  /* Cierra el veredicto. Este es el unico sitio del sistema con las seis
     condiciones: las cinco del lector llegan en el mensaje y la maquina se
     calcula aqui, contra la base que el usuario edita en Databases.
     De aqui sale la notificacion al plant manager, asi que no puede ser un
     valor provisional. */
  if(!VERDICT) return null;
  var motivos=(VERDICT.reasons||[]).slice();
  if(maq && maq.feasible===false){
    motivos.push('no machine in the shop takes this wire and outside diameter'+
                 (maq.why?' ('+maq.why+')':''));
  }
  return {verdict: motivos.length?'REQUIRES REVIEW':'FEASIBLE',
          reasons: motivos,
          machineChecked: !!maq};
}

function postFeasibility(S){
  if(!EMBEDDED) return;
  var checklist=[];
  if(DRAWING&&DRAWING.feasibility){
    for(var i=0;i<DRAWING.feasibility.length;i++){
      var it=DRAWING.feasibility[i];
      checklist.push({label:it.label, status:FEAS[it.id]||'unmarked'});
    }
  }
  var flags=[];
  if(S&&S.flags){
    for(var j=0;j<S.flags.length;j++)
      flags.push({level:S.flags[j].level, title:S.flags[j].title});
  }
  var bd=S?bandFromScore(S.score):null;
  /* La pantalla ya matiza la banda cuando no hubo punto de trabajo; este
     mensaje no lo hacia y mandaba "Manufacturable" con el mismo 70 que
     aqui se ensena como solo geometria. De las dos versiones viajaba
     justo la que promete mas. */
  if(bd && S && (S.flags||[]).some(function(x){
        return x && /not evaluated/.test(x.title||''); }))
    bd={band:'Geometry only \u2014 service not evaluated', color:'#8a6d1f'};
  /* La maquina es la sexta condicion de factibilidad y solo se puede comprobar
     aqui: la base vive en esta pantalla y el usuario la edita en Databases. */
  var maq=null;
  try{
    var I=(STATE.tab==='compression')?STATE.comp:
          (STATE.tab==='extension')?STATE.ext:STATE.tors;
    var g=resolveDia(I.odMode,I.dia,I.d);
    var sel=selectMachine(STATE.tab,I.d,g.OD,I.matId);
    maq={feasible:!!sel.feasible,
         count:(sel.all||[]).length,
         best:(sel.best&&sel.best.m)?sel.best.m.name:(sel.best?sel.best.name:null),
         why:(!sel.feasible&&sel.near&&sel.near[0])?sel.near[0].why.join(', '):''};
  }catch(e){}
  try{ window.parent.postMessage({source:'spring-calculator',type:'springFeasibility',
    payload:{springType:STATE.tab, score:(S?S.score:null), band:(bd?bd.band:''),
      flags:flags, checklist:checklist, machine:maq,
      verdict:verdictoFinal(maq)}},'*'); }catch(e){}
}

       mc(i,'tempMax',m.tempMax)+mc(i,'costFac',m.costFac)+'</tr>';
  }
  h+='</tbody></table></div>';
  return h;
}

}

/* =====================================================================
   14. EVENT BINDING
   ===================================================================== */
function bindGeneric(map,recompute){
  Object.keys(map).forEach(function(id){
    var el=document.getElementById(id); if(!el) return;
    var cfg=map[id];
    el.addEventListener(cfg.event||'input',function(){
      var v=el.value;
      if(cfg.kind) v=toSI(num(v),cfg.kind,STATE.unit);
      else if(cfg.numeric!==false && el.type==='number') v=num(v);
      cfg.set(v);
      recompute();
    });
  });
}
function bindComp(){
  var I=STATE.comp;
  var m={
    c_mat:{event:'change',numeric:false,set:function(v){I.matId=v;MAT_MANUAL=true;}},
    c_d:{kind:'len',set:function(v){I.d=v;}},
    c_odMode:{event:'change',numeric:false,set:function(v){I.odMode=v;}},
    c_dia:{kind:'len',set:function(v){I.dia=v;}},
    c_L0:{kind:'len',set:function(v){I.L0=v;}},
    c_endType:{event:'change',numeric:false,set:function(v){
      I.endType=v; I.Na=I.Nt-END_TYPES[v].endCoils;}},
    c_Nt:{set:function(v){I.Nt=v; I.Na=v-END_TYPES[I.endType].endCoils;}},
    c_Na:{set:function(v){I.Na=v;}},
    c_h:{kind:'len',set:function(v){I.h=v;}}
  };
  bindGeneric(m,renderComp);
}

function bindDB(){
  var sub=document.querySelectorAll('.subtab button');
  sub.forEach(function(b){ b.addEventListener('click',function(){
    STATE.dbtab=b.dataset.d; renderDB(); }); });
  document.querySelectorAll('input[data-mi]').forEach(function(el){

      var i=+el.dataset.mi,k=el.dataset.mk;

    });
  });
  document.querySelectorAll('input[data-ki],select[data-ki]').forEach(function(el){
    el.addEventListener(el.tagName==='SELECT'?'change':'input',function(){
