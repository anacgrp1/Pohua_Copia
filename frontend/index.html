<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pohua — Automatic RFQ quoting for industrial springs">
    <meta name="theme-color" content="#0B0F19">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Pohua · RFQ Quoter</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <!-- Los siete tamaños son el MISMO dibujo, assets/app-icon.png, escalado:
         el icono de la aplicación es uno y se ve igual en todas partes.
         Los genera scripts/generar_iconos.py; no se editan a mano. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png">
    <!-- iOS no lee los iconos del manifest y redondea las esquinas él mismo. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">

    <!-- La fuente (Inter) se sirve desde /assets/fonts: ver style.css. Ya no
         se pide nada a Google, así que no sale la IP de nadie a un tercero. -->
    <link rel="preload" href="/assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Tema claro/oscuro.
         Va aquí, antes de la hoja de estilos, y a propósito no está en un
         archivo aparte: tiene que ejecutarse antes del primer pintado. Si se
         decidiera el tema después de cargar el CSS, la página aparecería
         oscura un instante y saltaría a clara (el "flash" típico). -->
    <script>
        (function () {
            try {
                var guardado = localStorage.getItem('cgr-tema');
                if (guardado !== 'light' && guardado !== 'dark') {
                    guardado = (window.matchMedia &&
                                window.matchMedia('(prefers-color-scheme: light)').matches)
                               ? 'light' : 'dark';
                }
                document.documentElement.dataset.tema = guardado;
                marcarBarra(guardado);
            } catch (e) {
                document.documentElement.dataset.tema = 'dark';
                marcarBarra('dark');
            }

            // El color de la barra del navegador, ya en el primer pintado. Sin
            // esto arranca con el valor del <meta> —el del tema oscuro— y en
            // claro se ve una franja que no pega con la página hasta que
            // js/tema.js la corrige. Los valores son --bg-surface de cada
            // tema; el CSS todavía no está cargado, así que aquí van a mano.
            function marcarBarra(tema) {
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', tema === 'light' ? '#e9eef7' : '#172033');
            }
        })();
    </script>

    <!-- Styles -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Marca de entorno: sólo aparece en localhost. Sirve para no confundir
         una pestaña local con la de producción cuando están las dos abiertas
         y acabar aprobando o declinando un RFQ de verdad creyendo que se está
         probando. -->
    <script>
        if (['localhost', '127.0.0.1', '::1'].includes(location.hostname)) {
            document.documentElement.classList.add('es-local');
        }
    </script>
    <div class="marca-local" aria-hidden="true">LOCAL</div>

    <!-- ============================================================= -->
    <!-- FONDO ESPACIAL                                                 -->
    <!-- Decorativo: aria-hidden para que los lectores de pantalla lo   -->
    <!-- ignoren. Las estrellas las inyecta /js/starfield.js.           -->
    <!-- ============================================================= -->
    <div class="space-bg" aria-hidden="true">
        <div class="glow-background"></div>
        <canvas id="starfield"></canvas>
    </div>

    <!-- ============================================================= -->
    <!-- RELOJ DE LAS TRES CASAS                                        -->
    <!-- Arriba y al centro, entre el título y los controles de la      -->
    <!-- esquina. Tres modos —Kansas City, Querétaro y Sevran— y cada   -->
    <!-- uno con la fecha y la hora escritas como se escriben allí. Un  -->
    <!-- clic rota; con Mayúsculas, hacia atrás. Lo lleva js/reloj.js.  -->
    <!-- ============================================================= -->
    <div class="reloj" id="reloj">
        <button type="button" class="reloj-boton" id="btnReloj" aria-live="off">
            <svg class="reloj-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>
            </svg>
            <span class="reloj-fecha reloj-fecha--larga" id="relojFechaLarga"></span>
            <span class="reloj-fecha reloj-fecha--corta" id="relojFecha"></span>
            <span class="reloj-punto" aria-hidden="true"></span>
            <span class="reloj-hora" id="relojHora"></span>
            <span class="reloj-punto reloj-punto--ciudad" aria-hidden="true"></span>
            <span class="reloj-ciudad" id="relojCiudad"></span>
            <span class="reloj-codigo" id="relojCodigo" aria-hidden="true"></span>
        </button>
    </div>

    <!-- ============================================================= -->
    <!-- CONTROLES DE LA ESQUINA: idioma, tema y perfil                 -->
    <!-- Van en una barra en vez de tres elementos fijos con su propio  -->
    <!-- cálculo de `right`: así añadir uno no descoloca a los demás y  -->
    <!-- en un teléfono se encogen juntos.                              -->
    <!-- ============================================================= -->
    <div class="barra-esquina">
        <!-- Notificaciones: sólo con sesión abierta y permiso para ver RFQs;
             js/components/notificaciones.js lo enseña y lo esconde. -->
        <div class="notif" id="notificaciones" hidden>
            <button type="button" class="notif-boton" id="btnNotificaciones"
                    aria-haspopup="dialog" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <span class="notif-globo" id="notifGlobo" hidden></span>
            </button>
            <!-- El velo sólo pinta en el teléfono, donde el panel es un
                 cajón; en computadora se queda fuera de juego. -->
            <div class="notif-velo" id="notifVelo"></div>
            <div class="notif-panel" id="notifPanel" role="dialog"
                 aria-modal="false" aria-labelledby="notifTitulo"></div>
        </div>

        <div class="idioma" id="idioma">
            <button type="button" class="idioma-boton" id="btnIdioma"
                    aria-haspopup="listbox" aria-expanded="false"
                    data-i18n-titulo="idioma.boton">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                </svg>
                <span class="idioma-corto" id="idiomaCorto">EN</span>
            </button>
            <ul class="idioma-lista" id="idiomaLista" role="listbox" hidden></ul>
        </div>

        <button type="button" class="tema-toggle" id="btnTema"
                title="Switch theme" aria-label="Switch theme">
            <svg class="icono-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
            </svg>
            <svg class="icono-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </button>

        <!-- Perfil: sólo dentro de la aplicación. En la portada y el login no
             hay sesión que enseñar. -->
        <div class="perfil-menu" id="perfilMenu" hidden>
            <button type="button" class="perfil-menu-boton" id="btnPerfilMenu"
                    aria-haspopup="menu" aria-expanded="false"
                    data-i18n-titulo="menu.abrir"></button>
            <div class="perfil-menu-panel" id="perfilMenuPanel" role="menu" hidden></div>
        </div>
    </div>

    <!-- Mobile hamburger -->
    <button class="mobile-toggle" id="mobileToggle" data-i18n-titulo="nav.menu"
            aria-controls="sidebar" aria-expanded="false" hidden>
        <svg class="icono-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
        <svg class="icono-cerrar-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
    </button>

    <!-- HOME + SIGN IN                                                -->

    <div class="home-screen" id="homeScreen" hidden></div>

    <div class="login-screen" id="loginScreen" hidden></div>

    <div class="app-layout" hidden>

        <!-- El velo va DENTRO de .app-layout, en el mismo contexto de
             apilamiento que la barra lateral: si no, la tapa. -->
        <div class="mobile-overlay" id="mobileOverlay"></div>

        <!-- ============================================================= -->
        <!-- SIDEBAR                                                       -->
        <!-- ============================================================= -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <!-- El logo lleva a la portada (la pantalla de espera), sin
                     cerrar la sesión: App.mostrarPortada(). -->
                <button type="button" class="logo-boton" id="logoSidebar"
                        title="Home screen" aria-label="Home screen"
                        data-i18n-titulo="nav.portada">
                    <span class="logo-lockup">
                        <img src="/assets/isc-logo.png" alt="ISC" class="logo-lockup__isc">
                        <img src="/assets/logo.png" alt="CGR" class="logo-lockup__cgr">
                    </span>
                </button>
                <div class="sidebar-brand">
                    <span class="sidebar-brand-name">Pohua</span>
                    <span class="sidebar-brand-sub">RFQ Quoter</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="sidebar-section-label" data-i18n="nav.main">Main</div>

                <!-- PRIMERO. El Resumen es la pantalla de mando: quien entra
                     ve de golpe cómo va todo, y a partir de ahí decide dónde
                     meterse. Para admin se va al final —y sube el Monitor— con
                     la clase .sidebar-nav--admin; el orden lo pone el CSS, no
                     un reacomodo del DOM, para que el marcado siga siendo uno
                     solo y el foco del teclado no cambie de sitio a mitad de
                     sesión.
                     La comprobación de verdad la hace el servidor
                     (`resumen:ver`); esto es para no enseñar una puerta
                     cerrada. -->
                <button class="nav-item active" data-page="resumen" data-permiso="resumen:ver">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/>
                        <line x1="6" y1="20" x2="6" y2="14"/>
                    </svg>
                    <span data-i18n="nav.resumen">Overview</span>
                </button>

                <button class="nav-item" data-page="mail">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <span data-i18n="nav.mail">Mail</span>
                </button>

                <button class="nav-item" data-page="quoting">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
                        <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
                    </svg>
                    <span data-i18n="nav.quoting">Quoting</span>
                </button>

                <!-- El Monitor es material de administración: el registro lleva
                     rutas del servidor, correos de clientes y errores con
                     detalles internos. La comprobación de verdad la hace el
                     servidor (`monitor:ver`); esto es para no enseñar una
                     puerta cerrada. -->
                <button class="nav-item" data-page="monitor" data-permiso="monitor:ver">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                    </svg>
                    <span data-i18n="nav.monitor">Monitor</span>
                </button>

            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-status">
                    <span class="status-dot" id="workerDot"></span>
                    <span id="workerLabel" data-i18n="barra.servicioParado">Service stopped</span>
                </div>
                <nav class="sidebar-legal" id="sidebarLegal"></nav>
            </div>
        </aside>

        <!-- ============================================================= -->
        <!-- MAIN CONTENT                                                  -->
        <!-- ============================================================= -->
        <main class="main-content">

            <!-- Page Header -->
            <header class="page-header">
                <div>
                    <h1 class="page-title" id="pageTitle">Dashboard</h1>
                    <p class="page-subtitle" id="pageSubtitle">System overview</p>
                </div>
            </header>

            <!-- Page Body with all views -->
            <div class="page-body">

                <!-- MAIL -->
                <div class="page-view" id="page-mail"></div>

                <!-- QUOTING -->
                <div class="page-view active" id="page-quoting">
                    <div class="quoting-layout">
                        <div class="quoting-column" id="col-rfqs">
                            <div class="quoting-column-header">
                                <h2>RFQs</h2>
                            </div>
                            <div class="quoting-column-content">
                                <!-- List goes here -->
                            </div>
                        </div>
                        <div class="quoting-column" id="col-rfqs-completos">
                            <div class="quoting-column-header">
                                <h2>Completed RFQs</h2>
                            </div>
                            <div class="quoting-column-content">
                                <!-- List goes here -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- DETALLE RFQ -->
                <div class="page-view" id="page-rfq-detail"></div>

                <!-- COTIZACIÓN -->
                <div class="page-view" id="page-quote-review"></div>

                <!-- MONITOR -->
                <div class="page-view" id="page-resumen"></div>

                <div class="page-view" id="page-monitor"></div>

                <!-- SETTINGS -->

            </div>

            <!-- Asistente: barra fija, la misma en todas las pantallas. -->
            <div class="assistant-dock" id="assistantDock"></div>
        </main>
