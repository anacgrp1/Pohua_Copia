# Configuración de PostgREST para el Cotizador RFQ
# ===============================================
# Solo para desarrollo local con Docker (docker-compose up).
# En producción la app se conecta directamente vía psycopg2.

# La URL de conexión se lee de la variable de entorno PGRST_DB_URI
# que inyecta docker-compose.yml. NO hardcodear credenciales aquí.
db-uri = "$(PGRST_DB_URI)"

# El esquema de la base de datos que se va a exponer a través de la API
db-schema = "public"

# El rol anónimo que creamos en pgAdmin para definir los permisos
db-anon-role = "web_anon"

# El puerto donde PostgREST escuchará las peticiones HTTP de tu programa
server-port = 3000
